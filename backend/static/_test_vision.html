<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Offline BlazeFace load test</title>
  <script src="/vendor/tf.min.js"></script>
  <script src="/vendor/blazeface.min.js"></script>
</head>
<body>
  <pre id="out">starting…</pre>
  <script>
    const out = document.getElementById('out');
    const log = (m) => { out.textContent += '\n' + m; console.log('[TEST] ' + m); };

    (async () => {
      try {
        log('tfjs version: ' + tf.version.tfjs);
        const forceBackend = new URLSearchParams(location.search).get('b');
        if (forceBackend) {
          await tf.setBackend(forceBackend);
        } else {
          try { await tf.setBackend('webgl'); } catch (e) { log('webgl unavailable: ' + e.message); }
          if (tf.getBackend() !== 'webgl') { await tf.setBackend('cpu'); }
        }
        await tf.ready();
        log('backend: ' + tf.getBackend());

        const modelUrl = '/vendor/models/blazeface/model.json';
        log('loading model: blazeface from ' + modelUrl);
        const t0 = performance.now();
        const model = await blazeface.load({ modelUrl });
        log('model loaded in ' + Math.round(performance.now() - t0) + ' ms');

        // Imagen sintética: no hay ninguna cara, así que el resultado
        // esperado es una lista vacía. Lo que se verifica es que el modelo
        // cargue y que estimateFaces() corra de punta a punta sin internet.
        const c = document.createElement('canvas');
        c.width = 320; c.height = 240;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#334'; ctx.fillRect(0, 0, 320, 240);
        ctx.fillStyle = '#c9a'; ctx.fillRect(120, 60, 80, 140);

        const t1 = performance.now();
        const preds = await model.estimateFaces(c, false);
        log('estimateFaces() OK in ' + Math.round(performance.now() - t1) + ' ms');
        log('faces found: ' + preds.length);
        log('RESULT: OFFLINE_LOAD_OK');
      } catch (e) {
        log('ERROR: ' + (e && e.message ? e.message : e));
        log('RESULT: OFFLINE_LOAD_FAIL');
      }
    })();
  </script>
</body>
</html>
