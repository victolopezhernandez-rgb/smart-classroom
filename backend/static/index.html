          body.scale.set(1.0, 1.0, 0.78); add(body);
          // Hombros: redondean la unión torso-brazo
          [-1, 1].forEach(side => {
            const sh = new THREE.Mesh(new THREE.SphereGeometry(0.072, 14, 12), shirtMat);
            sh.position.set(x + side*0.115, 1.19, z); add(sh);
            const arm = new THREE.Mesh(cap(0.034, 0.28, 12), shirtMat);
            arm.position.set(x + side*0.17, 0.97, z);
            arm.rotation.z = side*0.30; add(arm);
            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.038, 12, 10), skinMat);
            hand.position.set(x + side*0.215, 0.78, z); add(hand);
          });
          // Cuello
          const neck = new THREE.Mesh(cap(0.043, 0.05, 12), skinMat);
          neck.position.set(x, 1.32, z); add(neck);
          // Cabeza — óvalo, no esfera perfecta
          const head = new THREE.Mesh(new THREE.SphereGeometry(0.114, 20, 16), skinMat);
          head.position.set(x, 1.50, z);
          head.scale.set(0.94, 1.06, 0.96); add(head);
          // Cabello: casquete que se apoya sobre el cráneo
          const hairM = new THREE.Mesh(
            new THREE.SphereGeometry(0.121, 20, 14, 0, Math.PI*2, 0, Math.PI*0.58),
            stdMat({ color: hair, roughness: 0.88 }));
          hairM.position.set(x, 1.508, z);
          hairM.scale.set(0.96, 1.04, 0.99); add(hairM);
        });
      }, [classroomState]);

      // ── Weather → windows + sun beams + rain ──────────────────────────────
      const prevWeatherRef = useRef(weather);
      useEffect(() => {
        if (!sceneRef.current) return;

        const prev = prevWeatherRef.current;
        const rainChanging = (prev === "rainy") !== (weather === "rainy");
        prevWeatherRef.current = weather;

        if (rainChanging) onLoadingChange?.(true);

        // El vidrio casi no tiñe: ahora hay exterior detrás y taparlo sería
        // desperdiciarlo. Quien cambia de humor es el CIELO.
        //
        // `dim` y `haze` tiñen TODO el exterior. Sin eso el cambio de clima
        // solo se notaba mirando arriba: desde el ángulo normal casi todo el
        // encuadre es pasto y árboles, y seguían igual de soleados bajo la
        // lluvia. Con cielo gris y pasto apagado, el clima se lee de una.
        const CLEAR = { color:0xdcecff, opacity:0.16, sky:['#2c74cf','#82b9ea','#e6f0f5'],
                        dim:1.00, haze:0.00, hazeColor:0xe6f0f5 };
        const cfg = {
          clear:    CLEAR,
          cloudy:   { color:0xd2dae4, opacity:0.20, sky:['#5b83ac','#9fb4c6','#dde4e9'],
                      dim:0.86, haze:0.10, hazeColor:0xdde4e9 },
          overcast: { color:0xbfc9d0, opacity:0.26, sky:['#6f7d88','#98a4ad','#c6ced3'],
                      dim:0.68, haze:0.20, hazeColor:0xc6ced3 },
          rainy:    { color:0x9fb0bd, opacity:0.34, sky:['#41505d','#63727e','#8f9aa3'],
                      dim:0.50, haze:0.30, hazeColor:0x8f9aa3 },
        }[weather] ?? CLEAR;
        windowGlassRef.current.forEach(g => {
          g.material.color.setHex(cfg.color);
          g.material.opacity = cfg.opacity;
        });
        if (skyRef.current) {
          skyRef.current.draw(...cfg.sky);
          skyRef.current.tex.needsUpdate = true;
        }
        // El cielo lo pinta su propio canvas, así que se salta el tinte.
        if (outsideRef.current) {
          const hz = new THREE.Color(cfg.hazeColor);
          outsideRef.current.traverse(o => {
            const m = o.material;
            if (!m || !m.color || o === skyRef.current?.mesh) return;
            if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
            m.color.copy(m.userData.baseColor).multiplyScalar(cfg.dim).lerp(hz, cfg.haze);
          });
        }
        sunBeamsRef.current.forEach(b => { b.visible = (weather === "clear"); });
        sunPoolsRef.current.forEach(p => { p.visible = (weather === "clear"); });
        if (rainRef.current.group)
          rainRef.current.group.visible = (weather === "rainy");

        if (rainChanging) {
          const t = setTimeout(() => onLoadingChange?.(false), 900);
          return () => clearTimeout(t);
        }
      }, [weather]);

      return <div ref={mountRef} id="canvas3d" />;
    }

    // ── Mini energy bar chart ─────────────────────────────────────────────────
    function EnergyBars({ history }) {
      if (!history?.length) return <div style={{color:"#334155",fontSize:"0.75rem",padding:"1rem 0"}}>{t('waiting')}</div>;

        <div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.65rem",color:"#64748b",marginBottom:"0.25rem"}}>
            <span>{t('last')} {history.length} {t('reads')}</span>
            <span>máx 320W</span>
          </div>
          <div className="chart-bar-wrap">
            {history.slice(-40).map((d, i) => (
              <div key={i} className="chart-bar" style={{ height: `${(d.watts/max)*100}%`, background: d.watts < 160 ? "#4ade80" : d.watts < 240 ? "#f97316" : "#ef4444" }} title={`${d.watts}W @ ${d.time}`} />
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.65rem",color:"#64748b",marginTop:"0.25rem"}}>
            <span style={{color:"#4ade80"}}>AI actual: {history[history.length-1]?.watts ?? 0}W</span>
            <span style={{color:"#ef4444"}}>Baseline: 320W</span>
          </div>
        </div>
      );
    }

    // ── Voice controller ──────────────────────────────────────────────────────
    function VoiceBtn({ lang, onProcessing }) {
      const [listening,   setListening]   = useState(false);
      const [processing,  setProcessing]  = useState(false);
      const [last,        setLast]        = useState(null);
      const [cmdOk,       setCmdOk]       = useState(null); // true=✓ false=✗
      const recRef          = useRef(null);
      const onProcessingRef = useRef(onProcessing);
      // Keep ref always current so the closure inside useEffect never goes stale
      onProcessingRef.current = onProcessing;

      useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        if (recRef.current) { try { recRef.current.stop(); } catch {} }
        const r = new SR();
        r.continuous = false; r.interimResults = false;
        r.lang = (lang === 'en') ? "en-US" : "es-ES";
        r.onresult = async (e) => {
          const text = e.results[0][0].transcript.toLowerCase();
          setLast(text);
          setCmdOk(null);
          setProcessing(true);
          onProcessingRef.current?.(true);
          // yield one macrotask so React renders the loading state
          // before the (potentially instant) fetch response arrives
          await new Promise(res => setTimeout(res, 0));
          const MIN_MS = 700; // keep the canvas spinner visible at least this long
          const t0 = Date.now();
          try {
            const res = await fetch("/api/voice/command", {
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body: JSON.stringify({ command: text })
            });
            setCmdOk(res.ok);
          } catch {
            setCmdOk(false);
          } finally {
            setProcessing(false);
            // Ensure the canvas overlay is visible for at least MIN_MS
            const elapsed = Date.now() - t0;
            const wait = Math.max(0, MIN_MS - elapsed);
            setTimeout(() => onProcessingRef.current?.(false), wait);
          }
        };
        r.onend = () => setListening(false);
        recRef.current = r;
        return () => { try { r.stop(); } catch {} };
      }, [lang]);

      const toggle = () => {
        if (!recRef.current || processing) return;
        if (listening) { recRef.current.stop(); setListening(false); }
        else { setCmdOk(null); recRef.current.start(); setListening(true); }
      };

      const btnClass = `voice-btn${listening?" listening":""}${processing?" processing":""}`;

      return (
        <div style={{display:"flex",alignItems:"center",gap:"0.75rem"}}>
          <div className="voice-btn-wrap">
            <button className={btnClass} onMouseDown={toggle} onTouchStart={toggle} title="Hablar">
              {processing ? "⚙️" : "🎤"}
            </button>
            {processing && <div className="voice-orbit" />}
          </div>
          <div style={{fontSize:"0.75rem"}}>
            {processing
              ? <span style={{color:"#a78bfa",fontWeight:600,display:"flex",alignItems:"center",gap:"0.35rem"}}>
                  <span className="spinner" style={{borderColor:"#a78bfa",borderTopColor:"transparent"}}/>
                  {t('voice.processing')}
                </span>
              : listening
                ? <span style={{color:"#ef4444",fontWeight:600}}>{t('voice.listening')}</span>
                : <span style={{color:"#64748b"}}>{t('voice.idle')}</span>
            }
            {last && !processing && (
              <div style={{color:"#94a3b8",marginTop:"0.15rem",display:"flex",alignItems:"center",gap:"0.3rem"}}>
                {cmdOk === true  && <span style={{color:"#4ade80",fontWeight:700}}>✓</span>}
                {cmdOk === false && <span style={{color:"#f87171",fontWeight:700}}>✗</span>}
                "{last}"
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Demo controls ─────────────────────────────────────────────────────────
    function DemoControls({ onSceneLoading }) {
      const [scenario, setScenario] = useState("full_class");
      const [weather, setWeather]   = useState("clear");
      const [simTime, setSimTime]   = useState(null);
      const [loading, setLoading]   = useState(null);
      const startLoad = (key) => { setLoading(key); };
      const endLoad   = ()    => { setLoading(null); };

      const cycle = () => fetch("/api/orchestrator/cycle", {method:"POST"});
      const clearOverride = () => fetch("/api/orchestrator/clear-override", {method:"POST"});

      const setS = async (s) => {
        setScenario(s); startLoad(`s-${s}`);
        try {
          await fetch("/api/vision/scenario",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({scenario:s})});
          await clearOverride(); await cycle();
        } catch {} finally { endLoad(); }
      };
      const setW = async (w) => {
        const rainChanging = (weather === "rainy") !== (w === "rainy");
        if (rainChanging) onSceneLoading?.(true);
        setWeather(w); startLoad(`w-${w}`);
        try {
          await fetch("/api/light/weather",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({weather:w})});
          await clearOverride(); await cycle();
        } catch {} finally { endLoad(); }
      };
      const setT = async (h) => {
        setSimTime(h); startLoad(`t-${h}`);
        try {
          await fetch("/api/light/time",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hour:h})});
          await clearOverride(); await cycle();
        } catch {} finally { endLoad(); }
      };

      const scenarios = [{id:"empty",k:"sc.empty"},{id:"few",k:"sc.few"},{id:"half_class",k:"sc.half"},{id:"full_class",k:"sc.full"},{id:"back_only",k:"sc.back"}];
      const weathers  = [{id:"clear",l:"☀️"},{id:"cloudy",l:"⛅"},{id:"overcast",l:"☁️"},{id:"rainy",l:"🌧️"}];
      const times     = [{h:6,l:"6h"},{h:8,l:"8h"},{h:10,l:"10h"},{h:12,l:"12h"},{h:15,l:"15h"},{h:17,l:"17h"},{h:18,l:"18h"},{h:null,k:"sc.real"}];

      const [isLiveCamera, setIsLiveCamera] = useState(false);

      // La ✕ de la ventana flotante vive fuera de React. Se le presta esta
      // función para que cerrar por ahí actualice el botón y muestre el
      // aviso igual que cerrar desde aquí.
      useEffect(() => {
        if (window.LiveCam) window.LiveCam.requestToggle = () => toggleLiveCamera();
        return () => { if (window.LiveCam) window.LiveCam.requestToggle = null; };
      });

      // La lógica de cámara vive en un <script> plano (sin Babel) más abajo:
      // window.LiveCam. Este botón solo delega y luego refleja el estado.
      //
      // Cambiar de modo reconstruye la escena igual que el clima lluvioso:
      // hay que pedir la webcam y cargar el modelo, y la primera vez eso
      // tarda. Se muestra el mismo aviso "Actualizando escena…" para que
      // la espera no parezca que la app se colgó.
      const toggleLiveCamera = async () => {
        onSceneLoading?.(true);
        startLoad("cam");
        const MIN_MS = 700;   // el aviso no debe parpadear si todo va rápido
        const t0 = Date.now();
        try {
          const next = await window.LiveCam.toggle();
          setIsLiveCamera(next);
          await clearOverride(); await cycle();
        } catch (e) {
          console.error("Error toggling live camera:", e);
        } finally {
          endLoad();
          setTimeout(() => onSceneLoading?.(false),
                     Math.max(0, MIN_MS - (Date.now() - t0)));
        }
      };

      return (
        <div className="panel">
          <h2>{t('demo')}</h2>
          <div style={{fontSize:"0.65rem",color:"#64748b",marginBottom:"0.3rem"}}>{t('occ')}</div>
          <div className="chip-group">{scenarios.map(({id,k})=>{const isLoading=loading===`s-${id}`; return <button key={id} className={`chip${scenario===id?" active-blue":""}${isLoading?" loading":""}`} onClick={()=>setS(id)}>{isLoading&&<span className="spinner"/>}{t(k)}</button>;})}</div>
          <div style={{fontSize:"0.65rem",color:"#64748b",marginBottom:"0.3rem"}}>{t('weather')}</div>
          <div className="chip-group">{weathers.map(({id,l})=>{const isLoading=loading===`w-${id}`; return <button key={id} className={`chip${weather===id?" active-orange":""}${isLoading?" loading":""}`} onClick={()=>setW(id)}>{isLoading&&<span className="spinner"/>}{l}</button>;})}</div>
          <div style={{fontSize:"0.65rem",color:"#64748b",marginBottom:"0.3rem"}}>{t('time')}</div>
          <div className="chip-group">{times.map(({h,l,k})=>{const isLoading=loading===`t-${h}`; return <button key={l||k} className={`chip${simTime===h?" active-purple":""}${isLoading?" loading":""}`} onClick={()=>setT(h)}>{isLoading&&<span className="spinner"/>}{k ? t(k) : l}</button>;})}</div>
          <div style={{fontSize:"0.65rem",color:"#64748b",marginTop:"0.5rem"}}>
            <button onClick={toggleLiveCamera}
              className={`chip active-green${loading==="cam"?" loading":""}`}
              style={{fontSize:"0.9rem",padding:"0.5rem 0.8rem"}}>
              {loading==="cam" && <span className="spinner"/>}
              {isLiveCamera ? "📹 Modo cámara" : "🎥 Cámara real"}
            </button>
          </div>
        </div>
      );
    }

    // ── Comparison Panel ──────────────────────────────────────────────────────
    function ComparisonPanel({ stats, watts, history }) {
      const COP_KWH = 800, BASE_W = 320, HRS = 8, DAYS = 200;
      const calc = (w) => ({
        kwh_h: w / 1000,
        cop_h: w / 1000 * COP_KWH,
        kwh_d: w / 1000 * HRS,
        cop_d: w / 1000 * HRS * COP_KWH,
        kwh_y: w / 1000 * HRS * DAYS,
        cop_y: w / 1000 * HRS * DAYS * COP_KWH,
      });
      const base  = calc(BASE_W);
      const ai_w  = stats?.avg_ai_watts ?? watts;
      const ai    = calc(ai_w);
      const fmt   = (n, d = 2) => Number(n).toFixed(d);
      const cop   = (n) => `$${Math.round(n).toLocaleString()} COP`;
      const sv_pct = Math.max(0, Math.round((BASE_W - ai_w) / BASE_W * 100));

      const refs = [
        { label: t('ref.rate'),  value: `$${COP_KWH.toLocaleString()} COP/kWh`, note: t('ref.rate.note') },
        { label: t('ref.base'),  value: `${BASE_W} W`,                           note: t('ref.base.note') },
        { label: t('ref.hrs'),   value: `${HRS} ${t('ref.hrs.unit')}`,           note: t('ref.hrs.note') },
        { label: t('ref.days'),  value: `${DAYS} ${t('ref.days.unit')}`,         note: t('ref.days.note') },
      ];

      const rows = [
        { label: t('row.power'),  b: `${BASE_W} W`,             a: `${ai_w} W`,               s: `${Math.round((BASE_W - ai_w) * 10) / 10} W (${sv_pct}%)`, big: false },
        { label: t('row.kwh_h'), b: `${fmt(base.kwh_h,3)} kWh`, a: `${fmt(ai.kwh_h,3)} kWh`,  s: `${fmt(base.kwh_h - ai.kwh_h, 3)} kWh`, big: false },
        { label: t('row.cop_h'), b: cop(base.cop_h),             a: cop(ai.cop_h),              s: cop(base.cop_h - ai.cop_h),        big: false },
        { label: `${t('row.kwh_d')} (${HRS}h)`, b: `${fmt(base.kwh_d)} kWh`, a: `${fmt(ai.kwh_d)} kWh`, s: `${fmt(base.kwh_d - ai.kwh_d)} kWh`, big: false },
        { label: t('row.cop_d'), b: cop(base.cop_d),             a: cop(ai.cop_d),              s: cop(base.cop_d - ai.cop_d),        big: false },
        { label: `${t('row.kwh_y')} (${DAYS}d)`, b: `${fmt(base.kwh_y,0)} kWh`, a: `${fmt(ai.kwh_y,0)} kWh`, s: `${fmt(base.kwh_y - ai.kwh_y, 0)} kWh`, big: true },
        { label: t('row.cop_y'), b: cop(base.cop_y),             a: cop(ai.cop_y),              s: cop(base.cop_y - ai.cop_y),        big: true },
        { label: t('row.hrs_d'), b: `${HRS} h`,                  a: `${fmt((ai_w/BASE_W)*HRS,1)} h`, s: `${fmt(((BASE_W-ai_w)/BASE_W)*HRS,1)} h`, big: false },
        { label: t('row.hrs_y'), b: `${HRS*DAYS} h`,             a: `${fmt((ai_w/BASE_W)*HRS*DAYS,0)} h`, s: `${fmt(((BASE_W-ai_w)/BASE_W)*HRS*DAYS,0)} h`, big: false },
      ];

      return (
        <div className="panel">
          <h2>{t('energy')}</h2>

          {/* Datos de referencia — siempre visibles */}
          <div className="ref-grid">
            {refs.map(({ label, value, note }) => (
              <div key={label} className="ref-card">
                <div className="ref-label">{label}</div>
                <div className="ref-value">{value}</div>
                <div className="ref-note">{note}</div>
              </div>
            ))}
          </div>

          {/* Tabla comparativa */}
          <div style={{ overflowX: "auto" }}>
            <table className="cmp-table">
              <thead>
                <tr>
                  <th style={{ textAlign: "left" }}>{t('col.metric')}</th>
                  <th style={{ color: "#f87171" }}>{t('col.noai')}</th>
                  <th style={{ color: "#4ade80" }}>{t('col.ai')}</th>
                  <th style={{ color: "#a78bfa" }}>{t('col.savings')}</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(({ label, b, a, s, big }) => (
                  <tr key={label} style={{ background: big ? "#a78bfa0a" : "transparent" }}>
                    <td style={{ color: "#94a3b8", fontWeight: big ? 700 : 400, whiteSpace: "nowrap" }}>{label}</td>
                    <td style={{ color: "#f87171", textAlign: "center" }}>{b}</td>
                    <td style={{ color: "#4ade80", textAlign: "center" }}>{a}</td>
                    <td style={{ color: "#a78bfa", textAlign: "center", fontWeight: big ? 700 : 600 }}>{s}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Gráfica de barras */}
          <div style={{ marginTop: "0.75rem" }}>
            <EnergyBars history={history} />
          </div>
        </div>
      );
    }

      const PHONE_CHG = 800;    // cargas de smartphone por kg CO₂
      const BASE_W = 320, HRS = 8, DAYS = 200;

      const base_kwh_y = BASE_W / 1000 * HRS * DAYS;
      const ai_w       = stats?.avg_ai_watts ?? watts ?? BASE_W;
      const ai_kwh_y   = ai_w / 1000 * HRS * DAYS;
      const base_co2   = +(base_kwh_y * CO2_KWH).toFixed(1);
      const ai_co2     = +(ai_kwh_y   * CO2_KWH).toFixed(1);
      const saved_co2  = +(base_co2   - ai_co2).toFixed(1);
      const pct        = base_co2 > 0 ? Math.round(saved_co2 / base_co2 * 100) : 0;
      const trees      = Math.max(0, Math.round(saved_co2 / TREE_KG));
      const km_car     = Math.round(saved_co2 * CAR_KM);

              { label:`${t('co2.noai')} — ${base_co2} kg CO₂/año`,            w:"100%",          color:"#ef4444" },
              { label:`${t('co2.ai')} — ${ai_co2} kg CO₂/año`,                w:barW(ai_co2),    color:"#4ade80" },
              { label:`${t('co2.saved')} — ${saved_co2} kg CO₂/año (${pct}%)`, w:barW(saved_co2), color:"#a78bfa" },

  <!-- ══ Live camera module (plain JS, sin Babel) ══
       Panel flotante tipo PiP: no toca el DOM de React. -->
  <script>
    (function () {
      const ZONE_COLORS = { zone_A: "#4a90d9", zone_B: "#5cb85c", zone_C: "#e8a838", zone_D: "#9b59b6" };
      const ZONE_LABELS = { zone_A: "A", zone_B: "B", zone_C: "C", zone_D: "D" };

      function getZone(nx, ny) {
        return nx < 0.5 ? (ny < 0.5 ? "zone_A" : "zone_C") : (ny < 0.5 ? "zone_B" : "zone_D");
      }

      // ── Cuántos rostros y con qué confianza ────────────────────────────────
      const MAX_FACES = 12;      // BlazeFace trae 10 por defecto
      // 0.75 es el umbral que trae BlazeFace, pensado para una cara grande
      // frente a la cámara de un celular. En una feria la gente está a dos o
      // tres metros y de perfil: con 0.75 se pierden caras válidas. 0.5 es el
      // término medio entre no detectar y marcar cosas que no son caras.
      const MIN_FACE_SCORE = 0.5;

      // ── De rostro a profundidad del salón ─────────────────────────────────
      // Con el detector de cuerpos, lo alto que aparecía alguien en el cuadro
      // decía a qué distancia estaba. Los rostros no sirven para eso: todas
      // las cabezas están más o menos a la misma altura, así que se apilan en
      // la franja del medio y todo el mundo caería en la misma fila de zonas.
      //
      // La pista buena es el TAMAÑO: el alto aparente de una cara es
      // inversamente proporcional a la distancia. Una cara que ocupa el 40%
      // del cuadro está a un metro de la cámara; una del 6%, a unos cinco.
      //
      // La cámara se pone AL FRENTE del salón, junto al tablero, mirando
      // hacia los puestos. Así que cerca de la cámara = frente del salón. El
      // backend usa y=0 para el frente (zonas A y B) e y=1 para el fondo
      // (C y D), o sea que cara grande → y chico.
      const FACE_NEAR = 0.40;    // alto de cara / alto de cuadro, a ~1 m
      const FACE_FAR  = 0.06;    // ídem, a ~5 m

      function depthFromFace(faceH, frameH) {
        const size = faceH / frameH;
        const cerca = (size - FACE_FAR) / (FACE_NEAR - FACE_FAR);  // 1 = pegado a la cámara
        return 1 - Math.max(0, Math.min(1, cerca));                // → 0 = frente del salón
      }

      let isLive = false;
      let stream = null;
      let model = null;
      let rafId = null;
      let lastPost = 0;
      let panelEl = null;
      let videoEl = null;
      let canvasEl = null;
      let statusEl = null;
      let peopleEl = null;
      let wrapEl = null;
      let lastFaces = [];    // última detección conocida, se repinta cada cuadro
      let detecting = false; // una inferencia a la vez

      // Tamaño y posición sobreviven al cerrar y volver a abrir: si el
      // presentador ya acomodó la ventana, no tiene que hacerlo otra vez.
      const MIN_W = 240, MIN_H = 220;
      let rect = null;   // {x, y, w, h}

      function defaultRect() {
        const w = 320, h = 360;
        return {
          x: 16,
          y: Math.max(16, window.innerHeight - h - 16),
          w: w,
          h: h,
        };
      }

      function applyRect() {
        // Nunca dejar la ventana fuera de la pantalla, aunque se haya
        // redimensionado el navegador desde la última vez. Si la pestaña
        // está oculta el viewport mide 0: ahí no se recorta nada, o la
        // ventana quedaría encogida en la esquina al volver.
        const vw = window.innerWidth, vh = window.innerHeight;
        if (vw > 0 && vh > 0) {
          rect.w = Math.max(MIN_W, Math.min(rect.w, vw - 8));
          rect.h = Math.max(MIN_H, Math.min(rect.h, vh - 8));
          rect.x = Math.max(0, Math.min(rect.x, vw - rect.w));
          rect.y = Math.max(0, Math.min(rect.y, vh - rect.h));
        }
        panelEl.style.left   = rect.x + "px";
        panelEl.style.top    = rect.y + "px";
        panelEl.style.width  = rect.w + "px";
        panelEl.style.height = rect.h + "px";
      }

      // Un solo manejador sirve para mover y para redimensionar: cambia
      // qué campos del rect toca el delta del puntero.
      function startPointerDrag(ev, mode) {
        ev.preventDefault();
        const x0 = ev.clientX, y0 = ev.clientY;
        const r0 = { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
        const onMove = (e) => {
          const dx = e.clientX - x0, dy = e.clientY - y0;
          if (mode === "move") { rect.x = r0.x + dx; rect.y = r0.y + dy; }
          else                 { rect.w = r0.w + dx; rect.h = r0.h + dy; }
          applyRect();
        };
        const onUp = () => {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          document.body.style.userSelect = "";
        };
        document.body.style.userSelect = "none";
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }

      function buildPanel() {
        if (!rect) rect = defaultRect();

        panelEl = document.createElement("div");
        panelEl.style.cssText =
          "position:fixed;z-index:9999;display:flex;flex-direction:column;" +
          "background:#131620;border:1px solid #4a527a;border-radius:12px;" +
          "box-shadow:0 8px 30px rgba(0,0,0,0.6);overflow:hidden;font-family:system-ui,sans-serif;";

        const head = document.createElement("div");
        head.style.cssText =
          "display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;" +
          "padding:0.5rem 0.7rem;background:#1a1d27;color:#e2e8f0;font-size:0.8rem;" +
          "font-weight:600;cursor:move;touch-action:none;";
        head.innerHTML =
          '<span><span style="color:#ef4444">●</span> CÁMARA REAL — LIVE' +
          '<span style="color:#64748b;font-weight:400;margin-left:0.4rem">⠿</span></span>';
        head.title = "Arrastra para mover";
        head.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button")) return;   // la ✕ no arrastra
          startPointerDrag(e, "move");
        });
        const closeBtn = document.createElement("button");
        closeBtn.textContent = "✕";
        closeBtn.style.cssText =
          "background:none;border:none;color:#94a3b8;font-size:0.9rem;cursor:pointer;";
        closeBtn.onclick = () =>
          (window.LiveCam.requestToggle || window.LiveCam.toggle)();
        head.appendChild(closeBtn);
        panelEl.appendChild(head);

        const wrap = document.createElement("div");
        wrap.style.cssText = "position:relative;width:100%;flex:1 1 auto;min-height:0;background:#000;";
        wrapEl = wrap;
        videoEl = document.createElement("video");
        videoEl.autoplay = true;
        videoEl.playsInline = true;
        videoEl.muted = true;
        // contain, no cover: con cover el video se recorta y los recuadros
        // quedarían corridos respecto a la cara. Prefiero franjas negras
        // antes que una detección que se ve mal puesta.
        videoEl.style.cssText =
          "width:100%;height:100%;object-fit:contain;transform:scaleX(-1);display:block;";
        wrap.appendChild(videoEl);
        canvasEl = document.createElement("canvas");
        canvasEl.style.cssText = "position:absolute;pointer-events:none;";
        wrap.appendChild(canvasEl);
        panelEl.appendChild(wrap);

        statusEl = document.createElement("div");
        statusEl.style.cssText = "padding:0.4rem 0.7rem;font-size:0.7rem;color:#94a3b8;";
        statusEl.textContent = "Iniciando cámara…";
        panelEl.appendChild(statusEl);

        peopleEl = document.createElement("div");
        peopleEl.style.cssText =
          "padding:0 0.7rem 0.6rem;font-size:0.85rem;font-weight:700;color:#4ade80;flex:0 0 auto;";
        peopleEl.textContent = "Personas: 0";
        panelEl.appendChild(peopleEl);

        // Asa de redimensionado: dos rayitas en la esquina, como las de
        // cualquier ventana. Va encima de todo para que siempre se agarre.
        const grip = document.createElement("div");
        grip.title = "Arrastra para cambiar el tamaño";
        grip.style.cssText =
          "position:absolute;right:0;bottom:0;width:18px;height:18px;z-index:2;" +
          "cursor:nwse-resize;touch-action:none;" +
          "background:linear-gradient(135deg,transparent 48%,#64748b 48%,#64748b 58%," +
          "transparent 58%,transparent 70%,#64748b 70%,#64748b 80%,transparent 80%);";
        grip.addEventListener("pointerdown", (e) => startPointerDrag(e, "resize"));
        panelEl.appendChild(grip);

        document.body.appendChild(panelEl);
        applyRect();
        // Si cambia el tamaño de la ventana del navegador (o se conecta un
        // proyector), la ventanita se vuelve a meter en pantalla sola.
        window.addEventListener("resize", onViewportResize);
      }

      function onViewportResize() { if (panelEl && rect) applyRect(); }

      function setStatus(msg, color) {
        if (statusEl) { statusEl.textContent = msg; statusEl.style.color = color || "#94a3b8"; }
      }

      async function postMode(source) {
        try {
          await fetch("/api/vision/mode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ source: source })
          });
        } catch (e) { console.error("mode post error", e); }
      }

      async function postLive(people) {
        try {
          await fetch("/api/vision/live", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ people: people })
          });
        } catch (e) { console.error("live post error", e); }
      }

      async function start() {
        buildPanel();
        try {
          setStatus("Accediendo a la webcam…");
          stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
          videoEl.srcObject = stream;
          await videoEl.play();

          setStatus("Cargando modelo de IA…");
          if (!model) {
            model = await blazeface.load({
              modelUrl: "/vendor/models/blazeface/model.json",
              maxFaces: MAX_FACES,
              scoreThreshold: MIN_FACE_SCORE,
            });
            // Los pesos cargan en milisegundos, pero la PRIMERA inferencia
            // compila los shaders de WebGL y tarda varios segundos. Se
            // paga acá, con el aviso de carga en pantalla, y no en el primer
            // cuadro de la cámara ya en vivo. De ahí en más son ~30 ms.
            setStatus("Preparando el detector…");
            const warm = document.createElement("canvas");
            warm.width = 128; warm.height = 128;
            await model.estimateFaces(warm, false);
          }

          await postMode("live_camera");
          isLive = true;
          setStatus("● Detección activa", "#4ade80");
          loop();
          return true;
        } catch (e) {
          setStatus("Error: " + (e && e.message ? e.message : e), "#f87171");
          isLive = false;
          return false;
        }
      }

      function stop() {
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach((t) => t.stop());
        postMode("simulated");
        window.removeEventListener("resize", onViewportResize);
        if (panelEl) { panelEl.remove(); panelEl = null; }
        wrapEl = null;
        lastFaces = [];
        detecting = false;
        isLive = false;
        return false;
      }

      // Traduce lo que devuelve BlazeFace a cajas en píxeles del video.
      // estimateFaces(video, returnTensors=false) → [{topLeft, bottomRight,
      // landmarks, probability}]; sin tensores todo llega ya como arrays y
      // probability viene envuelta en una lista de un elemento.
      function toFaces(predictions) {
        return predictions
          .map(function (f) {
            const p = Array.isArray(f.probability) ? f.probability[0] : f.probability;
            const x1 = f.topLeft[0], y1 = f.topLeft[1];
            const x2 = f.bottomRight[0], y2 = f.bottomRight[1];
            return {
              x: x1, y: y1, w: x2 - x1, h: y2 - y1,
              score: typeof p === "number" ? p : 1,
              landmarks: f.landmarks || [],
            };
          })
          .filter((f) => f.score >= MIN_FACE_SCORE && f.w > 2 && f.h > 2);
      }

      // Con object-fit:contain el video deja franjas negras dentro del panel.
      // El canvas se planta exactamente encima del rectángulo que ocupa la
      // imagen — si no, los recuadros aparecen desplazados de la cara.
      function fitCanvasToVideo(vw, vh) {
        const W = wrapEl.clientWidth, H = wrapEl.clientHeight;
        if (!W || !H) return;
        const s = Math.min(W / vw, H / vh);
        const dw = vw * s, dh = vh * s;
        canvasEl.style.left = ((W - dw) / 2).toFixed(1) + "px";
        canvasEl.style.top = ((H - dh) / 2).toFixed(1) + "px";
        canvasEl.style.width = dw.toFixed(1) + "px";
        canvasEl.style.height = dh.toFixed(1) + "px";
      }

      function drawOverlay(ctx, vw, vh) {
        // El canvas tiene la resolución del video (640×480) pero se muestra
        // encogido a unos 300 px. Si se dibujara con medidas fijas, un trazo
        // de 2 px se vería de 1 y el texto de 12 px, de 6: prácticamente
        // invisible. Todo se escala respecto al ancho real del cuadro.
        const S = vw / 320;

        // Guía de mitades. Solo la vertical: izquierda/derecha del cuadro sí
        // es izquierda/derecha del salón. El corte frente/fondo ya no depende
        // de la altura en pantalla sino del tamaño del rostro, así que una
        // línea horizontal aquí mentiría.
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 1 * S;
        ctx.setLineDash([6 * S, 6 * S]);
        ctx.beginPath();
        ctx.moveTo(vw / 2, 0); ctx.lineTo(vw / 2, vh);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "bold " + (13 * S).toFixed(0) + "px system-ui";
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.fillText("A · C", 8 * S, 20 * S);
        ctx.fillText("B · D", vw - 52 * S, 20 * S);
        ctx.font = (11 * S).toFixed(0) + "px system-ui";
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillText("acércate → frente (A·B)  ·  aléjate → fondo (C·D)", 8 * S, vh - 8 * S);
      }

      function drawFaces(ctx, faces, vw, vh) {
        const S = vw / 320;

        faces.forEach((f) => {
          const nxScreen = 1 - (f.x + f.w / 2) / vw;      // el video va espejado
          const zone = getZone(nxScreen, depthFromFace(f.h, vh));
          const col = ZONE_COLORS[zone];
          const dx = vw - (f.x + f.w);                    // caja, ya espejada

          // Esquinas en vez de un rectángulo cerrado: se lee como mira de
          // cámara y no tapa la cara. Con sombra para que resalte sobre
          // cualquier fondo, claro u oscuro.
          const c = Math.min(f.w, f.h) * 0.28;
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.85)";
          ctx.shadowBlur = 4 * S;
          ctx.strokeStyle = col;
          ctx.lineWidth = 3 * S;
          ctx.lineCap = "round";
          ctx.beginPath();
          [[dx, f.y, 1, 1], [dx + f.w, f.y, -1, 1],
           [dx, f.y + f.h, 1, -1], [dx + f.w, f.y + f.h, -1, -1]].forEach(([px, py, sx, sy]) => {
            ctx.moveTo(px + c * sx, py); ctx.lineTo(px, py);ctx.lineTo(px, py + c * sy);
          });
          ctx.stroke();

          // Los 6 puntos de BlazeFace (ojos, orejas, nariz, boca): dejan ver
          // de un vistazo que lo detectado es la cara y no el bulto.
          ctx.shadowBlur = 0;
          ctx.fillStyle = col;
          f.landmarks.forEach((pt) => {
            ctx.beginPath();
            ctx.arc(vw - pt[0], pt[1], 2 * S, 0, Math.PI * 2);
            ctx.fill();
          });

          // Etiqueta con la zona, sobre una pastilla del color de la zona.
          const label = ZONE_LABELS[zone] + "  " + Math.round(f.score * 100) + "%";
          ctx.font = "bold " + (12 * S).toFixed(0) + "px system-ui";
          const tw = ctx.measureText(label).width;
          // Arriba del recuadro si cabe; si no, debajo. Y siempre dentro del
          // cuadro: una cara pegada al borde inferior empujaba la etiqueta
          // fuera del canvas y no se veía.
          let ly = f.y > 20 * S ? f.y - 7 * S : f.y + f.h + 15 * S;
          ly = Math.max(14 * S, Math.min(ly, vh - 5 * S));
          ctx.fillStyle = col;
          ctx.fillRect(dx - 2 * S, ly - 12 * S, tw + 10 * S, 16 * S);
          ctx.fillStyle = "#0b1220";
          ctx.fillText(label, dx + 3 * S, ly);
          ctx.restore();
        });
      }

      function loop() {
        if (!isLive) return;
        rafId = requestAnimationFrame(loop);
        if (!videoEl || videoEl.readyState < 2 || !model) return;

        const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
        if (!vw || !vh) return;

        if (canvasEl.width !== vw) { canvasEl.width = vw; canvasEl.height = vh; }
        fitCanvasToVideo(vw, vh);

        // Dibujar y detectar van por separado a propósito. Una inferencia
        // tarda ~30 ms y el navegador repinta cada ~16 ms: si los recuadros
        // se pintaran dentro del .then(), un cuadro posterior ya habría
        // limpiado el canvas y se borrarían antes de verse. Así que cada
        // cuadro repinta la ÚLTIMA detección conocida, y la detección corre a
        // su propio ritmo — una a la vez, para no saturar la GPU con
        // inferencias encimadas (que además empeoran lo que detecta).
        const ctx = canvasEl.getContext("2d");
        ctx.clearRect(0, 0, vw, vh);
        drawOverlay(ctx, vw, vh);
        drawFaces(ctx, lastFaces, vw, vh);

        if (!detecting) {
          detecting = true;
          model.estimateFaces(videoEl, false).then(function (predictions) {
            lastFaces = toFaces(predictions);
            peopleEl.textContent = "Rostros: " + lastFaces.length;

            const now = Date.now();
            if (now - lastPost > 400) {
              postLive(lastFaces.slice(0, 5).map((f) => ({
                x: 1 - (f.x + f.w / 2) / vw,
                y: depthFromFace(f.h, vh),
              })));
              lastPost = now;
            }
          }).catch(function () {
            lastFaces = [];
          }).then(function () { detecting = false; });
        }
      }

      window.LiveCam = {
        toggle: async function () {
          return isLive ? stop() : start();
        },
        // La rellena DemoControls; ver el comentario de allá.
        requestToggle: null,
        isLive: function () { return isLive; }
      };
    })();
  </script>
</body>
