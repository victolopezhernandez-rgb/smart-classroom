<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Classroom AI</title>

  <!-- Scripts served locally — no internet required -->
  <script src="/vendor/react.min.js"></script>
  <script src="/vendor/react-dom.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="/vendor/tf.min.js"></script>
  <!-- BlazeFace: detector de ROSTROS (<1 MB). Reemplaza a COCO-SSD, que
       detectaba el cuerpo entero y pesaba 65 MB. -->
  <script src="/vendor/blazeface.min.js"></script>
  <script src="/vendor/three.min.js"></script>

  <!-- ── Dónde vive el backend ─────────────────────────────────────────────
       En local (localhost) usa el mismo servidor: no hace falta configurar nada.
       Publicado en internet, apunta al backend de Render.
       ⚠️ Cambia esta URL por la de tu app en Render antes de subir a Netlify. -->
  <script>
    window.API_BASE =
      location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? ""
        : "https://smart-classroom-rtne.onrender.com";

    // Redirige las llamadas /api/... al backend cuando está en otro dominio
    if (window.API_BASE) {
      const _fetch = window.fetch.bind(window);
      window.fetch = function (url, opts) {
        if (typeof url === "string" && url.startsWith("/api/")) {
          url = window.API_BASE + url;
        }
        return _fetch(url, opts);
      };
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f1117; }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4268; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0e16;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(90deg, #13162080 0%, #1a1d2780 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #ffffff0d;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 {
      font-size: 1rem; font-weight: 700; letter-spacing: -0.01em;
      background: linear-gradient(90deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.68rem; padding: 0.25rem 0.7rem;
      border-radius: 9999px; font-weight: 600; letter-spacing: 0.02em;
    }
    .badge.on  { background: #14532d50; color: #4ade80; border: 1px solid #4ade8040; }
    .badge.off { background: #450a0a50; color: #f87171; border: 1px solid #f8717140; }

    .reset-btn {
      font-size: 0.68rem; padding: 0.25rem 0.75rem;
      border-radius: 9999px; border: 1px solid #3d426860;
      background: #1e223240; color: #94a3b8; cursor: pointer;
      font-weight: 600; letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .reset-btn:hover { background: #2d314860; color: #cbd5e1; border-color: #4a527a; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    main {
      display: grid; grid-template-columns: 1fr 360px;
      gap: 1rem; padding: 1rem 1.5rem; max-width: 1400px; margin: 0 auto;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

    /* ── Panels ─────────────────────────────────────────────────────────── */
    .panel {
      background: #13162080;
      border: 1px solid #ffffff0d;
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 4px 24px #00000040;
      backdrop-filter: blur(4px);
    }
    .panel h2 {
      font-size: 0.65rem; font-weight: 700; color: #475569;
      margin-bottom: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .panel h2::before {
      content: ""; display: inline-block;
      width: 2px; height: 0.75rem;
      background: currentColor; border-radius: 1px; opacity: 0.6;
    }

    /* ── Zone cards ─────────────────────────────────────────────────────── */
    .zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .zone-card { border-radius: 0.5rem; padding: 0.75rem; border: 1px solid transparent; transition: box-shadow 0.3s; }
    .zone-card.ON  { border-color: #eab30860; background: #1c1a0960; box-shadow: 0 0 12px #eab30818; }
    .zone-card.DIM { border-color: #f9731660; background: #1c110960; box-shadow: 0 0 12px #f9731618; }
    .zone-card.OFF { border-color: #33415560; background: #10131a; }
    .zone-card.BLINK {
      border-color: #ef4444; background: #2a0d0d;
      animation: zoneBlink 0.7s steps(1) infinite;
    }
    @keyframes zoneBlink {
      0%, 49%   { box-shadow: 0 0 14px #ef444460; background: #3a1010; }
      50%, 100% { box-shadow: 0 0 0 #ef444400; background: #1a0808; }
    }

    /* ── Emergencia ─────────────────────────────────────────────────────── */
    .emg-banner {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.9rem; border-radius: 0.6rem;
      background: #7f1d1d; border: 1px solid #ef4444;
      margin: 0 1.5rem; animation: emgPulse 0.9s ease-in-out infinite;
    }
    @keyframes emgPulse {
      0%, 100% { box-shadow: 0 0 0 0 #ef444455; }
      50%      { box-shadow: 0 0 0 7px #ef444400; }
    }
    .emg-banner .emg-icon  { font-size: 1.3rem; }
    .emg-banner .emg-title { font-weight: 800; font-size: 0.85rem; color: #fecaca; letter-spacing: 0.01em; }
    .emg-banner .emg-sub   { font-size: 0.68rem; color: #fca5a5; margin-top: 0.1rem; }

    .emg-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.35rem; }
    .emg-btn {
      padding: 0.55rem 0.3rem; border-radius: 0.5rem; cursor: pointer;
      border: 1px solid #ef444440; background: #2a0d0d80; color: #fca5a5;
      font-size: 0.68rem; font-weight: 600; text-align: center;
      transition: all 0.15s; line-height: 1.35;
    }
    .emg-btn:hover  { border-color: #ef4444; background: #45111180; color: #fecaca; }
    .emg-btn.active { border-color: #ef4444; background: #7f1d1d; color: #fff; box-shadow: 0 0 12px #ef444440; }
    .emg-btn .emg-btn-icon { font-size: 1.1rem; display: block; margin-bottom: 0.1rem; }
    .emg-clear {
      width: 100%; margin-top: 0.4rem; padding: 0.5rem;
      border-radius: 0.5rem; cursor: pointer; font-size: 0.7rem; font-weight: 700;
      border: 1px solid #4ade8050; background: #14532d40; color: #4ade80;
      transition: all 0.15s;
    }
    .emg-clear:hover     { background: #14532d80; border-color: #4ade80; }
    .emg-clear:disabled  { opacity: 0.4; cursor: not-allowed; }
    .emg-route {
      font-size: 0.65rem; color: #94a3b8; margin-top: 0.5rem;
      padding-top: 0.5rem; border-top: 1px solid #1e2232; line-height: 1.5;
    }
    .emg-route b { color: #4ade80; }

    /* El lienzo se enmarca en rojo mientras dura la emergencia */
    .canvas-wrap.emergency { animation: canvasAlarm 0.7s steps(1) infinite; border-radius: 0.5rem; }
    @keyframes canvasAlarm {
      0%, 49%   { box-shadow: 0 0 0 3px #ef4444, 0 0 22px #ef444455; }
      50%, 100% { box-shadow: 0 0 0 3px #ef444430, 0 0 0 #ef444400; }
    }
    .zone-name  { font-weight: 600; font-size: 0.78rem; color: #cbd5e1; }
    .zone-state { font-size: 1.2rem; margin: 0.2rem 0 0.1rem; }
    .zone-meta  { font-size: 0.63rem; color: #475569; line-height: 1.4; }

    /* ── Chips ──────────────────────────────────────────────────────────── */
    .chip-group { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.75rem; }
    .chip {
      padding: 0.25rem 0.65rem; border-radius: 0.375rem;
      border: 1px solid #33415560; background: transparent;
      color: #64748b; cursor: pointer; font-size: 0.7rem;
      transition: all 0.15s;
    }
    .chip:hover { border-color: #4a527a; color: #94a3b8; }
    .chip.active-blue   { border-color: #3b82f6; background: #1e3a5f80; color: #93c5fd; font-weight: 600; }
    .chip.active-orange { border-color: #f97316; background: #43140780; color: #fdba74; font-weight: 600; }
    .chip.active-purple { border-color: #a855f7; background: #3b076480; color: #d8b4fe; font-weight: 600; }
    .chip.active-green  { border-color: #22c55e; background: #05391f80; color: #86efac; font-weight: 600; }

    /* ── 3D Canvas ──────────────────────────────────────────────────────── */
    #canvas3d { width: 100%; height: 420px; border-radius: 0.5rem; overflow: hidden; display: block; }

    /* ── Voice button ───────────────────────────────────────────────────── */
    .voice-btn {
      width: 3rem; height: 3rem; border-radius: 50%;
      border: 2px solid #4ade8060; background: transparent;
      color: #4ade80; font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; box-shadow: 0 0 0 0 #4ade8030;
    }
    .voice-btn:hover { border-color: #4ade80; box-shadow: 0 0 12px #4ade8030; }
    .voice-btn.listening {
      background: #ef444415; border-color: #ef4444;
      color: #ef4444; animation: pulse 1.2s infinite;
    }
    .voice-btn.processing {
      background: #7c3aed15; border-color: #7c3aed;
      color: #a78bfa; cursor: wait; pointer-events: none;
      animation: processingPulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 #ef444440; }
      50%       { box-shadow: 0 0 0 8px #ef444400; }
    }
    @keyframes processingPulse {
      0%, 100% { box-shadow: 0 0 0 0 #7c3aed40, 0 0 14px #7c3aed25; }
      50%       { box-shadow: 0 0 0 8px #7c3aed00, 0 0 20px #7c3aed40; }
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
    .voice-orbit {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #a78bfa;
      border-right-color: #7c3aed60;
      animation: orbit 0.8s linear infinite;
      pointer-events: none;
    }
    .voice-btn-wrap { position: relative; display: inline-flex; flex-shrink: 0; }

    /* ── Mini energy chart ──────────────────────────────────────────────── */
    .chart-bar-wrap { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin-top: 0.5rem; }
    .chart-bar { flex: 1; border-radius: 2px 2px 0 0; min-width: 6px; transition: height 0.3s; opacity: 0.85; }

    .history-item { font-size: 0.67rem; color: #475569; padding: 0.25rem 0; border-bottom: 1px solid #1e223260; }
    .history-item:last-child { border-bottom: none; }
    .history-item .hw { color: #4ade80; font-weight: 600; }

    /* ── Reference cards ────────────────────────────────────────────────── */
    .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-bottom: 0.85rem; }
    .ref-card {
      background: #0b0e1680; border: 1px solid #facc1520;
      border-radius: 0.5rem; padding: 0.55rem 0.7rem;
      transition: border-color 0.2s;
    }
    .ref-card:hover { border-color: #facc1545; }
    .ref-label { font-size: 0.6rem; color: #475569; margin-bottom: 0.1rem; }
    .ref-value { font-size: 0.88rem; font-weight: 700; color: #fbbf24; }
    .ref-note  { font-size: 0.58rem; color: #334155; margin-top: 0.1rem; }

    /* ── Comparison table ───────────────────────────────────────────────── */
    .cmp-table { width: 100%; border-collapse: collapse; font-size: 0.69rem; }
    .cmp-table thead tr { border-bottom: 1px solid #1e2232; }
    .cmp-table th {
      padding: 0.4rem 0.55rem; font-size: 0.62rem; font-weight: 700;
      color: #475569; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .cmp-table td { padding: 0.34rem 0.55rem; border-bottom: 1px solid #1a1d2760; }
    .cmp-table tbody tr:hover { background: #ffffff05 !important; }
    .cmp-table tr:last-child td { border-bottom: none; }

    /* ── Section divider label ──────────────────────────────────────────── */
    .section-label {
      font-size: 0.6rem; font-weight: 700; color: #334155;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin: 0.85rem 0 0.45rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .section-label::after {
      content: ""; flex: 1; height: 1px; background: #1e2232;
    }

    /* ── Carbon bars ────────────────────────────────────────────────────── */
    .carbon-bar-track {
      background: #0b0e16; border-radius: 0.3rem;
      height: 16px; overflow: hidden;
      border: 1px solid #1e223260;
    }
    .carbon-bar-fill  { height: 100%; border-radius: 0.3rem; transition: width 0.7s cubic-bezier(.4,0,.2,1); }

    /* ── Carbon equivalence cards ───────────────────────────────────────── */
    .carbon-eq-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.45rem; }
    .carbon-eq-card {
      background: #0b0e1680; border: 1px solid #4ade8020;
      border-radius: 0.5rem; padding: 0.6rem 0.4rem; text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .carbon-eq-card:hover { border-color: #4ade8050; box-shadow: 0 0 10px #4ade8010; }

    /* ── MOBILE ─────────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      /* Header */
      header { padding: 0.6rem 0.9rem; gap: 0.5rem; }
      header h1 { font-size: 0.82rem; }
      .badge { font-size: 0.65rem; padding: 0.2rem 0.55rem; }
      .reset-btn { font-size: 0.65rem; padding: 0.2rem 0.6rem; }

      /* Layout */
      main { padding: 0.75rem; gap: 0.75rem; }

      /* Panels */
      .panel { padding: 0.75rem; }
      .panel h2 { font-size: 0.68rem; margin-bottom: 0.65rem; }

      /* 3D canvas */
      #canvas3d { height: 260px; }

      /* Zones */
      .zone-grid { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
      .zone-card { padding: 0.6rem; }
      .zone-name  { font-size: 0.72rem; }
      .zone-meta  { font-size: 0.62rem; }
      .zone-state { font-size: 1rem; }

      /* Chips */
      .chip { padding: 0.3rem 0.55rem; font-size: 0.68rem; min-height: 34px; }
      .chip-group { gap: 0.25rem; }

      /* Ref cards */
      .ref-grid { grid-template-columns: 1fr 1fr; }
      .ref-value { font-size: 0.8rem; }

      /* Tables */
      .cmp-table { font-size: 0.65rem; }
      .cmp-table th { padding: 0.3rem 0.4rem; font-size: 0.58rem; }
      .cmp-table td { padding: 0.28rem 0.4rem; }

      /* Carbon bars */
      .carbon-bar-track { height: 12px; }
      .carbon-eq-grid { grid-template-columns: 1fr 1fr 1fr; gap: 0.35rem; }
      .carbon-eq-card { padding: 0.45rem 0.3rem; }

      /* Section labels */
      .section-label { font-size: 0.58rem; }

      /* Voice */
      .voice-btn { width: 2.75rem; height: 2.75rem; font-size: 1.1rem; }

      /* Canvas overlay */
      .canvas-overlay-label { font-size: 0.62rem; }
      .canvas-spinner { width: 1.8rem; height: 1.8rem; }
    }

    @media (max-width: 400px) {
      .ref-grid { grid-template-columns: 1fr; }
      .carbon-eq-grid { grid-template-columns: 1fr 1fr; gap: 0.3rem; }
      header h1 { font-size: 0.75rem; }
    }

    /* ── Loading spinner (inline) ───────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 0.65em; height: 0.65em;
      border: 1.5px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.55s linear infinite;
      vertical-align: middle; margin-right: 0.3em;
    }
    .chip.loading { opacity: 0.55; cursor: wait; pointer-events: none; }
    .reset-btn:disabled { opacity: 0.6; cursor: wait; }

    /* ── Language toggle ────────────────────────────────────────────────── */
    .lang-toggle {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 9999px; padding: 0.15rem 0.2rem; gap: 0.1rem;
    }
    .lang-btn {
      padding: 0.22rem 0.6rem; border-radius: 9999px; border: none;
      font-size: 0.72rem; font-weight: 700; cursor: pointer;
      background: transparent; color: #64748b; transition: all 0.2s;
    }
    .lang-btn.active {
      background: linear-gradient(135deg, #2563eb, #0891b2);
      color: #fff; box-shadow: 0 0 10px rgba(37,99,235,0.4);
    }

    /* ── 3D scene loading overlay ───────────────────────────────────────── */
    .canvas-wrap { position: relative; }

    /* Viñeta: oscurece las esquinas para que la mirada caiga en el centro
       del salón. Es el remate que se le hace a cualquier plano de juego,
       y aquí sale gratis — una capa CSS, ni un píxel extra de GPU.
       pointer-events:none para no robarle el arrastre al lienzo. */
    .canvas-wrap::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      border-radius: 0.5rem; z-index: 1;
      background:
        radial-gradient(120% 90% at 50% 45%,
          rgba(0,0,0,0) 52%, rgba(0,0,0,0.16) 78%, rgba(0,0,0,0.42) 100%);
      mix-blend-mode: multiply;
    }
    /* En emergencia manda el marco rojo; la viñeta estorbaría. */
    .canvas-wrap.emergency::after { display: none; }
    .canvas-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.6rem;
      background: #0b0e1660;
      backdrop-filter: blur(3px);
      border-radius: 0.5rem;
      z-index: 5;
      pointer-events: none;
    }
    .canvas-spinner {
      width: 2.2rem; height: 2.2rem;
      border: 3px solid #ffffff12;
      border-top-color: #4ade80;
      border-right-color: #4ade8060;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      box-shadow: 0 0 14px #4ade8030;
    }
    .canvas-overlay-label {
      font-size: 0.68rem; color: #4ade80; font-weight: 600;
      letter-spacing: 0.04em; opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── WebSocket hook ────────────────────────────────────────────────────────
    function useClassroomWS() {
      const [state, setState]       = useState(null);
      const [connected, setConn]    = useState(false);
      const wsRef = useRef(null);

      useEffect(() => {
        function connect() {
          // wss:// es obligatorio si la página se sirve por HTTPS
          const wsUrl = window.API_BASE
            ? window.API_BASE.replace(/^http/, "ws") + "/ws"
            : `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
          const ws = new WebSocket(wsUrl);
          ws.onopen  = () => { setConn(true); };
          ws.onclose = () => { setConn(false); setTimeout(connect, 3000); };
          ws.onerror = () => ws.close();
          ws.onmessage = (e) => {
            let msg;
            try {
              msg = JSON.parse(e.data);
            } catch {
              return; // ignore non-JSON messages (e.g. "pong" keepalive)
            }
            if (msg.type === "STATE_UPDATE") setState(msg.payload);
          };
          const ping = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 25000);
          wsRef.current = { ws, ping };
        }
        connect();
        return () => { wsRef.current?.ws.close(); clearInterval(wsRef.current?.ping); };
      }, []);

      return { state, connected };
    }

    // ── helpers ──────────────────────────────────────────────────────────────

    // Caja de cantos redondeados. Un cubo perfecto no existe en el mundo
    // real: todo mueble tiene el filo matado, y ese filo es el que atrapa un
    // reflejo delgado de luz. Sin él la escena se ve de bloques; con él, los
    // objetos se leen como madera y plástico. Se cachea porque treinta
    // pupitres idénticos deben compartir la misma malla.
    const _rboxCache = new Map();
    function RBox(w, h, d) {
      const key = `${w}|${h}|${d}`;
      const hit = _rboxCache.get(key);
      if (hit) return hit;

      const bev = Math.min(Math.min(w, h, d) * 0.18, 0.035);
      const W = w - bev*2, H = h - bev*2;
      const r  = Math.min(Math.min(W, H) * 0.22, 0.09);

      const s = new THREE.Shape();
      s.moveTo(-W/2 + r, -H/2);
      s.lineTo( W/2 - r, -H/2);
      s.quadraticCurveTo( W/2, -H/2,  W/2, -H/2 + r);
      s.lineTo( W/2,  H/2 - r);
      s.quadraticCurveTo( W/2,  H/2,  W/2 - r,  H/2);
      s.lineTo(-W/2 + r,  H/2);
      s.quadraticCurveTo(-W/2,  H/2, -W/2,  H/2 - r);
      s.lineTo(-W/2, -H/2 + r);
      s.quadraticCurveTo(-W/2, -H/2, -W/2 + r, -H/2);

      const geo = new THREE.ExtrudeGeometry(s, {
        depth: d - bev*2, bevelEnabled: true,
        bevelThickness: bev, bevelSize: bev, bevelSegments: 2, curveSegments: 5,
      });
      geo.translate(0, 0, -(d/2 - bev));
      geo.computeVertexNormals();
      _rboxCache.set(key, geo);
      return geo;
    }

    // Material físico por defecto: superficies mate de mobiliario escolar.
    // Con scene.environment puesto, incluso lo mate recoge un rebote suave.
    const stdMat = (p) => new THREE.MeshStandardMaterial(
      Object.assign({ roughness: 0.74, metalness: 0.04 }, p));

    function box(w, h, d, mat, x, y, z, scene) {
      const m = new THREE.Mesh(RBox(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m); return m;
    }

    // Deriva un mapa de normales del propio dibujo de la textura, con un
    // filtro Sobel: donde el color cambia de golpe (la junta entre dos
    // tablas, el grano, el moteado del corcho) la superficie se inclina.
    // Sin esto la madera es una calcomanía sobre un plano perfectamente
    // liso y la luz resbala sin engancharse en nada. Con esto cada tabla
    // tiene relieve propio y el piso responde al moverse la cámara.
    function normalMapFromCanvas(src, strength) {
      const w = src.width, h = src.height;
      const px = src.getContext('2d').getImageData(0, 0, w, h).data;
      const lum = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++)
        lum[i] = (px[i*4]*0.299 + px[i*4+1]*0.587 + px[i*4+2]*0.114) / 255;

      // Envuelve en los bordes: la textura se repite, así que el relieve
      // también tiene que ser continuo o se ve la costura.
      const at = (x, y) => lum[((y + h) % h) * w + ((x + w) % w)];

      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const octx = out.getContext('2d');
      const img = octx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const dx = (at(x+1,y-1) + 2*at(x+1,y) + at(x+1,y+1))
                   - (at(x-1,y-1) + 2*at(x-1,y) + at(x-1,y+1));
          const dy = (at(x-1,y+1) + 2*at(x,y+1) + at(x+1,y+1))
                   - (at(x-1,y-1) + 2*at(x,y-1) + at(x+1,y-1));
          const nx = -dx * strength, ny = -dy * strength, nz = 1;
          const len = Math.hypot(nx, ny, nz) || 1;
          const i = (y * w + x) * 4;
          img.data[i]     = ((nx/len) * 0.5 + 0.5) * 255;
          img.data[i + 1] = ((ny/len) * 0.5 + 0.5) * 255;
          img.data[i + 2] = ((nz/len) * 0.5 + 0.5) * 255;
          img.data[i + 3] = 255;
        }
      }
      octx.putImageData(img, 0, 0);
      // Un mapa de normales guarda vectores, no color: jamás va en sRGB.
      const t = new THREE.CanvasTexture(out);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }

    // ── 3D Classroom ─────────────────────────────────────────────────────────
    function Classroom3D({ classroomState, weather, onLoadingChange }) {
      const mountRef        = useRef(null);
      const sceneRef        = useRef(null);
      const lightsRef       = useRef({});
      const zoneOverlaysRef = useRef({});
      const peopleRef       = useRef([]);
      const windowGlassRef  = useRef([]);
      const sunBeamsRef     = useRef([]);
      const sunPoolsRef     = useRef([]);
      const skyRef          = useRef(null);
      const outsideRef      = useRef(null);
      const rainRef         = useRef({ group: null, drops: [] });
      // Molde de la sombra de contacto, compartido por muebles y personas.
      const contactRef      = useRef(null);
      const dustRef         = useRef(null);
      // Zonas que están parpadeando ahora mismo y a qué ritmo. El bucle de
      // render lo lee en cada cuadro; así el parpadeo va con el reloj real
      // y no depende de que lleguen mensajes del servidor.
      const blinkRef        = useRef({ zones: [], ms: 600 });

      // ── Scene setup (runs once) ───────────────────────────────────────────
      useEffect(() => {
        const mount = mountRef.current;
        const W = mount.clientWidth, H = mount.clientHeight;

        // Renderer — pipeline de color físico.
        // Tres ajustes hacen casi toda la diferencia entre "bloques planos"
        // y una escena de videojuego: espacio de color sRGB (si no, los
        // colores salen lavados), tonemapping ACES (comprime los brillos en
        // vez de quemarlos a blanco) y sombras suaves de alta resolución.
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
        else renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.02;
        mount.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x161a29);
        scene.fog = new THREE.Fog(0x161a29, 22, 38);
        sceneRef.current = scene;

        // ── Iluminación de entorno (IBL) ──────────────────────────────────
        // Sin un mapa de entorno los materiales físicos se ven de plástico
        // mate. Construimos uno a mano: un cubo con emisores — cielo arriba,
        // luz cálida por la ventana, rebote del piso — y lo pasamos por el
        // PMREM para que cada superficie reciba reflejos suaves. Es el mismo
        // truco que usan los visores de producto; no cuesta ningún archivo.
        const envScene = new THREE.Scene();
        const emit = (c, w, h, d, x, y, z) => {
          const q = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
            new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide }));
          q.position.set(x, y, z); envScene.add(q);
        };
        emit(0x2c3244, 30, 20, 30, 0, 0, 0);   // caja base, gris azulado
        emit(0xffffff, 12,  0.4, 12, 0,  8,  0);  // cielo raso difuso
        emit(0xfff0d0,  0.4, 8,  10, -9, 3,  0);  // ventanal cálido
        emit(0xc8a878, 14,  0.4, 14, 0, -4,  0);  // rebote del piso de madera
        const pmrem = new THREE.PMREMGenerator(renderer);
        const envRT = pmrem.fromScene(envScene, 0.04);
        scene.environment = envRT.texture;
        pmrem.dispose();

        const camera = new THREE.PerspectiveCamera(52, W/H, 0.1, 100);

        // ── Lighting ──────────────────────────────────────────────────────
        // Sky/ground hemisphere
        scene.add(new THREE.HemisphereLight(0xdce8ff, 0xc4a46a, 0.42));
        // Directional (sunlight through windows)
        const dirLight = new THREE.DirectionalLight(0xfff4dc, 1.15);
        dirLight.position.set(-5, 9, 3);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.radius = 3;
        dirLight.shadow.camera.near   = 0.5;
        dirLight.shadow.camera.far    = 26;
        dirLight.shadow.camera.left   = -7;
        dirLight.shadow.camera.right  = 12;
        dirLight.shadow.camera.top    = 9;
        dirLight.shadow.camera.bottom = -1;
        dirLight.shadow.camera.updateProjectionMatrix();
        dirLight.shadow.bias = -0.0008;
        // Empuja la sombra un pelo hacia dentro del objeto: mata el moaré
        // de superficies casi paralelas al sol sin despegar la sombra del
        // pie de los muebles.
        dirLight.shadow.normalBias = 0.02;
        scene.add(dirLight);

        // Iluminación de tres puntos, como en cine. La clave (arriba) ya
        // está; faltan las otras dos, y son las que dan volumen:
        //
        //   RELLENO  frío, desde el lado opuesto, sin sombra. Levanta el
        //            interior de las sombras para que no sean agujeros
        //            negros, y el contraste cálido/frío separa los planos.
        //   REBOTE   cálido, desde abajo, imitando la luz que devuelve el
        //            piso de madera. Sin él las caras y el canto inferior
        //            de los muebles se ven muertos.
        const fillLight = new THREE.DirectionalLight(0x9dbcff, 0.34);
        fillLight.position.set(11, 5, 9);
        scene.add(fillLight);

        const bounceLight = new THREE.DirectionalLight(0xffd9a0, 0.22);
        bounceLight.position.set(5, -3, 4);
        scene.add(bounceLight);

        // ── Piso de madera ────────────────────────────────────────────────
        // Roble claro, del color exacto de las fotos del colegio: no es
        // madera oscura de escritorio, es un laminado pálido casi miel.
        const fc = document.createElement('canvas'); fc.width = 512; fc.height = 512;
        const fctx = fc.getContext('2d');
        const plankH = 512 / 10;
        for (let i = 0; i < 10; i++) {
          const y = i * plankH;
          const v = 0.93 + Math.random() * 0.12;
          fctx.fillStyle = `rgb(${Math.round(211*v)},${Math.round(181*v)},${Math.round(137*v)})`;
          fctx.fillRect(0, y + 1, 512, plankH - 2);
          // Wood grain lines
          fctx.strokeStyle = 'rgba(120,85,40,0.09)';
          fctx.lineWidth = 1;
          for (let g = 0; g < 5; g++) {
            fctx.beginPath();
            fctx.moveTo(0, y + (plankH/5)*g + 3);
            fctx.bezierCurveTo(170, y+(plankH/5)*g+3+(Math.random()-0.5)*3,
                               340, y+(plankH/5)*g+3+(Math.random()-0.5)*3,
                               512, y+(plankH/5)*g+3+(Math.random()-0.5)*2);
            fctx.stroke();
          }
          // Plank gap
          fctx.fillStyle = 'rgba(0,0,0,0.22)'; fctx.fillRect(0, y, 512, 1.5);
        }
        const floorTex = new THREE.CanvasTexture(fc);
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(2, 1.6);
        // Un canvas trae color sRGB. Si no se declara, three lo interpreta
        // como lineal y la madera sale apagada y sucia — el error de color
        // más común al pasar un proyecto al pipeline físico.
        floorTex.colorSpace = THREE.SRGBColorSpace;
        // El piso se ve casi de canto desde la cámara. Sin filtrado
        // anisotrópico las tablas del fondo se deshacen en papilla.
        floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const floorNrm = normalMapFromCanvas(fc, 2.2);
        floorNrm.repeat.copy(floorTex.repeat);
        floorNrm.anisotropy = floorTex.anisotropy;

        // Laminado escolar: no es madera cruda, está sellado. La capa de
        // barniz (clearcoat) es lo que devuelve el reflejo alargado de las
        // lámparas sobre el piso — el detalle que más "engaña" al ojo.
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 8),
          new THREE.MeshPhysicalMaterial({
            map: floorTex,
            normalMap: floorNrm,
            normalScale: new THREE.Vector2(0.55, 0.55),
            roughness: 0.46, metalness: 0.0,
            clearcoat: 0.42, clearcoatRoughness: 0.55,
          }));
        floor.rotation.x = -Math.PI/2; floor.position.set(5, 0, 4);
        floor.receiveShadow = true; scene.add(floor);

        // ── Sombra de contacto ────────────────────────────────────────────
        // El mapa de sombras cubre 10×8 metros: no le alcanza la resolución
        // para oscurecer el milímetro donde una pata toca el piso, y sin esa
        // mancha los muebles parecen flotar un dedo por encima. Los juegos
        // lo resuelven igual desde hace veinte años: una calcomanía difusa
        // debajo de cada objeto. Es falso y es lo que hace que se vea real.
        const aoCv = document.createElement('canvas'); aoCv.width = aoCv.height = 128;
        const actx = aoCv.getContext('2d');
        const ag = actx.createRadialGradient(64, 64, 2, 64, 64, 64);
        ag.addColorStop(0,    'rgba(0,0,0,0.55)');
        ag.addColorStop(0.42, 'rgba(0,0,0,0.24)');
        ag.addColorStop(1,    'rgba(0,0,0,0)');
        actx.fillStyle = ag; actx.fillRect(0, 0, 128, 128);
        const aoTex = new THREE.CanvasTexture(aoCv);
        const aoGeo = new THREE.PlaneGeometry(1, 1);
        contactRef.current = { tex: aoTex, geo: aoGeo };

        const contactShadow = (x, z, size, opacity, parent) => {
          const m = new THREE.Mesh(aoGeo, new THREE.MeshBasicMaterial({
            map: aoTex, transparent: true, opacity,
            depthWrite: false, color: 0x000000,
          }));
          m.rotation.x = -Math.PI/2;
          m.position.set(x, 0.008, z);       // bajo las capas de zona
          m.scale.set(size, size, 1);
          (parent ?? scene).add(m);
          return m;
        };

        // ── Zone overlays ─────────────────────────────────────────────────
        const zColors  = { zone_A:0x4a90d9, zone_B:0x5cb85c, zone_C:0xe8a838, zone_D:0x9b59b6 };
        const zCenters = { zone_A:[2.5,2],  zone_B:[7.5,2],  zone_C:[2.5,6],  zone_D:[7.5,6] };
        Object.entries(zCenters).forEach(([z,[x,zz]]) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(5, 4),
            new THREE.MeshBasicMaterial({ color:zColors[z], transparent:true, opacity:0.10, depthWrite:false }));
          m.rotation.x = -Math.PI/2; m.position.set(x, 0.02, zz);
          scene.add(m); zoneOverlaysRef.current[z] = m;
        });

        // ── Techo ─────────────────────────────────────────────────────────
        // En el colegio real no hay cielo raso de plafones: la losa queda
        // expuesta, oscura, y de ella cuelgan discos acústicos verdes. Ese
        // contraste — techo oscuro, discos claros — es lo que hace que el
        // salón se reconozca al instante.
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(10, 8),
          stdMat({ color: 0x24262b, side: THREE.FrontSide }));
        ceil.rotation.x = Math.PI/2; ceil.position.set(5, 3.3, 4); scene.add(ceil);

        // ── Muros ─────────────────────────────────────────────────────────
        // Blanco hueso con dos franjas horizontales de corcho: los paneles
        // acústicos que recorren el salón a media altura en las fotos.
        const wc = document.createElement('canvas'); wc.width = 512; wc.height = 256;
        const wctx = wc.getContext('2d');
        wctx.fillStyle = '#f2efe8'; wctx.fillRect(0,0,512,256);
        // Las dos bandas de corcho, con su moteado
        [[92,34],[152,34]].forEach(([by,bh]) => {
          wctx.fillStyle = '#cfc08c';
          wctx.fillRect(24, by, 464, bh);
          wctx.fillStyle = 'rgba(120,100,50,0.16)';
          for (let d=0; d<900; d++)
            wctx.fillRect(24+Math.random()*464, by+Math.random()*bh, 1.6, 1.6);
          wctx.strokeStyle = 'rgba(150,130,80,0.35)'; wctx.lineWidth = 1;
          wctx.strokeRect(24, by, 464, bh);
        });
        const wallTex = new THREE.CanvasTexture(wc);
        wallTex.colorSpace = THREE.SRGBColorSpace;
        // Relieve suave: el corcho pica la superficie y el yeso queda con
        // su grano. Muy sutil a propósito — un muro con demasiado relieve
        // parece piedra, y estos son paneles lisos.
        const wallNrm = normalMapFromCanvas(wc, 1.1);
        const wallMat  = stdMat({
          map: wallTex, normalMap: wallNrm,
          normalScale: new THREE.Vector2(0.35, 0.35),
          roughness: 0.95,
        });
        const baseMat  = stdMat({ color: 0xe4ded0 });
        [
          { pos:[5,1.7,0.01],    ry:0,           w:10, h:3.4 },
          { pos:[5,1.7,7.99],    ry:Math.PI,     w:10, h:3.4 },
          { pos:[9.99,1.7,4],    ry:-Math.PI/2,  w:8,  h:3.4 },
        ].forEach(({pos,ry,w,h}) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
          m.position.set(...pos); m.rotation.y=ry; m.receiveShadow=true; scene.add(m);
        });

        // ── Hexágono, la firma del colegio ────────────────────────────────
        // En las fotos de la fachada el hexágono está SENTADO: lado plano
        // arriba y abajo, vértices a izquierda y derecha. (Antes se dibujaba
        // de pie, con un vértice arriba — no es el del colegio.)
        const hexShape = (r) => {
          const s = new THREE.Shape();
          for (let i = 0; i < 6; i++) {
            const a = i * Math.PI/3;
            const px = Math.cos(a)*r, py = Math.sin(a)*r;
            i === 0 ? s.moveTo(px,py) : s.lineTo(px,py);
          }
          s.closePath();
          return s;
        };

        // Las ventanas del colegio no van en fila: son racimos irregulares de
        // hexágonos de distinto tamaño perforando el muro. Cada racimo cae
        // sobre una franja del salón para que la luz siga entrando por donde
        // el backend cree que entra.
        const WINDOWS = [
          { z: 1.30, y: 2.10, r: 0.62 },
          { z: 2.10, y: 1.42, r: 0.31 },
          { z: 1.95, y: 2.62, r: 0.24 },
          { z: 3.80, y: 2.18, r: 0.70 },
          { z: 4.60, y: 1.30, r: 0.29 },
          { z: 6.25, y: 2.02, r: 0.58 },
          { z: 6.98, y: 2.66, r: 0.26 },
          { z: 7.05, y: 1.48, r: 0.22 },
        ];

        // ── Muro izquierdo, perforado de verdad ───────────────────────────
        // Este muro no se dibuja con PlaneGeometry: se recorta. Sin agujero
        // real, el vidrio es una calcomanía sobre una pared sólida y el ojo
        // lo nota al instante.
        const WALL_T = 0.24;                       // espesor del muro
        const leftShape = new THREE.Shape();
        leftShape.moveTo(-4, -1.7); leftShape.lineTo(4, -1.7);
        leftShape.lineTo(4, 1.7);   leftShape.lineTo(-4, 1.7);
        leftShape.closePath();
        // Coordenadas locales del muro: al girarlo 90° sobre Y, el eje X
        // local apunta hacia -Z del mundo, y el Y local es la altura.
        const toLocal = (w) => ({ hx: 4 - w.z, hy: w.y - 1.7 });
        WINDOWS.forEach(w => {
          const { hx, hy } = toLocal(w);
          const holePath = new THREE.Path();
          for (let i = 0; i < 6; i++) {
            const a = i * Math.PI/3;
            const px = hx + Math.cos(a)*w.r, py = hy + Math.sin(a)*w.r;
            i === 0 ? holePath.moveTo(px,py) : holePath.lineTo(px,py);
          }
          holePath.closePath();
          leftShape.holes.push(holePath);
        });
        const leftGeo = new THREE.ShapeGeometry(leftShape);
        // ShapeGeometry copia las coordenadas del contorno como UV, así que
        // vienen en metros. Hay que normalizarlas o la textura del muro sale
        // ampliada ocho veces.
        {
          const uv = leftGeo.attributes.uv;
          for (let i = 0; i < uv.count; i++)
            uv.setXY(i, (uv.getX(i) + 4) / 8, (uv.getY(i) + 1.7) / 3.4);
          uv.needsUpdate = true;
        }
        const leftWall = new THREE.Mesh(leftGeo, wallMat);
        leftWall.position.set(0.01, 1.7, 4);
        leftWall.rotation.y = Math.PI/2;
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Cara exterior del muro, en color del colegio: se ve por el hueco
        // de las ventanas y da a entender que el muro tiene dos lados.
        const leftOuter = new THREE.Mesh(leftGeo.clone(),
          stdMat({ color: 0xe8c93f, roughness: 0.88, side: THREE.DoubleSide }));
        leftOuter.position.set(-WALL_T, 1.7, 4);
        leftOuter.rotation.y = Math.PI/2;   // mismo giro: si se invierte, los huecos se van al lado opuesto
        scene.add(leftOuter);
        // Baseboards
        [
          { pos:[5,0.09,0.02],   ry:0,          w:10, h:0.17 },
          { pos:[5,0.09,7.98],   ry:Math.PI,    w:10, h:0.17 },
          { pos:[9.98,0.09,4],   ry:-Math.PI/2, w:8,  h:0.17 },
          { pos:[0.02,0.09,4],   ry:Math.PI/2,  w:8,  h:0.17 },
        ].forEach(({pos,ry,w,h}) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), baseMat);
          m.position.set(...pos); m.rotation.y=ry; scene.add(m);
        });

        // ── Chalkboard (front wall) ───────────────────────────────────────
        // Marco naranja claro y tablero verde, como el del laboratorio
        const frameMat = stdMat({ color: 0xe08c3a });
        const boardMesh = new THREE.Mesh(RBox(5.4, 1.55, 0.055),
          stdMat({ color: 0x3f8a4e, roughness: 0.34, metalness: 0.06 }));
        boardMesh.position.set(4.4, 2.12, 0.055); scene.add(boardMesh);
        // Frame strips
        [[4.4,2.92,0.07,5.6,0.10,0.07],[4.4,1.32,0.07,5.6,0.10,0.07],
         [1.64,2.12,0.07,0.10,1.72,0.07],[7.16,2.12,0.07,0.10,1.72,0.07]
        ].forEach(([x,y,z,fw,fh,fd]) => {
          const fs = new THREE.Mesh(RBox(fw,fh,fd), frameMat);
          fs.position.set(x,y,z); scene.add(fs);
        });
        // Chalk tray
        const tray = new THREE.Mesh(RBox(5.4,0.055,0.12), frameMat);
        tray.position.set(4.4,1.37,0.10); scene.add(tray);
        // Chalk text lines (white)
        const chalkMat = new THREE.MeshBasicMaterial({ color: 0xdde8e0 });
        [[3.0,2.5,0.7],[4.4,2.1,0.9],[5.5,2.6,0.5],[3.6,1.75,0.6],[5.0,1.8,0.4]].forEach(([cx,cy,len]) => {
          const l = new THREE.Mesh(RBox(len,0.028,0.01),chalkMat);
          l.position.set(cx,cy,0.10); scene.add(l);
        });

        // ── Puerta arqueada (muro del fondo, lado derecho = zona D) ───────
        // Magenta con ojo de buey, tal cual la del salón de música. Es
        // también la salida de evacuación: por eso el protocolo de
        // emergencia deja la zona D siempre con luz fija.
        const doorMat = stdMat({ color: 0xb1478f });
        const DW = 1.02, DH = 2.25, DR = DW/2;   // arco de medio punto arriba

        const doorShape = new THREE.Shape();
        doorShape.moveTo(-DR, 0);
        doorShape.lineTo(-DR, DH - DR);
        doorShape.absarc(0, DH - DR, DR, Math.PI, 0, true);
        doorShape.lineTo(DR, 0);
        doorShape.closePath();

        const doorMesh = new THREE.Mesh(
          new THREE.ExtrudeGeometry(doorShape, { depth: 0.07, bevelEnabled: false }), doorMat);
        doorMesh.rotation.y = Math.PI;
        doorMesh.position.set(9, 0, 7.95);
        doorMesh.castShadow = true; scene.add(doorMesh);

        // Ojo de buey
        const port = new THREE.Mesh(new THREE.CircleGeometry(0.14, 20),
          new THREE.MeshBasicMaterial({ color: 0xf4f7f8 }));
        port.rotation.y = Math.PI; port.position.set(9, 1.72, 7.87); scene.add(port);
        const portRing = new THREE.Mesh(new THREE.TorusGeometry(0.145, 0.022, 8, 20),
          stdMat({ color: 0xf6f4ef }));
        portRing.position.set(9, 1.72, 7.88); scene.add(portRing);

        // Manija
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.052,10,10),
          stdMat({color:0xd9d2c4}));
        knob.position.set(8.62,1.05,7.86); scene.add(knob);

        // ── Ventanas hexagonales (muro izquierdo, x=0) ────────────────────
        // Tres cosas hacen que un hueco se lea como ventana, y ninguna es el
        // vidrio: que se vea el ESPESOR del muro al asomarse, que haya un
        // MUNDO detrás, y que entre LUZ con la forma del hueco. El vidrio
        // solo pone el brillo encima.
        const winFrameMat = stdMat({ color: 0xf7f5f0, roughness: 0.82 });

        WINDOWS.forEach(w => {
          // Derrame: el muro tiene 24 cm y el hueco los atraviesa. Este anillo
          // extruido es la pared vista de canto — la pista de profundidad que
          // más pesa cuando la cámara se mueve.
          const revealShape = hexShape(w.r + 0.13);
          const inner = new THREE.Path();
          for (let i = 0; i < 6; i++) {
            const a = i * Math.PI/3;
            const px = Math.cos(a)*w.r, py = Math.sin(a)*w.r;
            i === 0 ? inner.moveTo(px,py) : inner.lineTo(px,py);
          }
          inner.closePath();
          revealShape.holes.push(inner);
          const reveal = new THREE.Mesh(
            new THREE.ExtrudeGeometry(revealShape, { depth: WALL_T, bevelEnabled: false }),
            winFrameMat);
          reveal.rotation.y = Math.PI/2;
          reveal.position.set(0.01, w.y, w.z);
          reveal.castShadow = true; reveal.receiveShadow = true;
          scene.add(reveal);

          // Vidrio: casi transparente, para que se vea el exterior. Lo que lo
          // delata como vidrio no es el tinte sino el reflejo del entorno.
          const glass = new THREE.Mesh(
            new THREE.ShapeGeometry(hexShape(w.r)),
            new THREE.MeshPhysicalMaterial({
              color: 0xdcecff, transparent: true, opacity: 0.18,
              roughness: 0.05, metalness: 0.0,
              envMapIntensity: 1.6, side: THREE.DoubleSide, depthWrite: false,
            }));
          glass.rotation.y = Math.PI/2;
          glass.position.set(-WALL_T/2, w.y, w.z);
          scene.add(glass); windowGlassRef.current.push(glass);
        });

        // ── Haces de sol ──────────────────────────────────────────────────
        // Un cilindro de 6 lados ES un prisma hexagonal: el haz sale con la
        // forma de la ventana que lo produce, no como un cono genérico.
        const beamMat = new THREE.MeshBasicMaterial({
          color:0xfff8d0, transparent:true, opacity:0.06,
          side:THREE.DoubleSide, depthWrite:false, fog:false, blending:THREE.AdditiveBlending,
        });
        WINDOWS.filter(w => w.r > 0.4).forEach(w => {
          const len = 3.4;
          const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(w.r*0.95, w.r*1.7, len, 6, 1, true),
            beamMat.clone());
          // El sol entra desde (-5,9,3): el haz se inclina hacia dentro y baja.
          beam.rotation.z = -Math.PI/2 + 0.52;
          beam.rotation.y = 0.28;
          beam.position.set(w.r + 0.9, w.y - 0.75, w.z - 0.35);
          beam.visible = false;
          scene.add(beam); sunBeamsRef.current.push(beam);
        });

        // Mancha de luz en el piso, con la forma del hexágono. El sol viaja en
        // dirección (5,-9,-3), así que desde (0,y,z) toca el piso en
        // x = 5y/9,  z = z - y/3.
        const poolMat = new THREE.MeshBasicMaterial({
          color: 0xfff1c8, transparent: true, opacity: 0.20,
          depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
        });
        WINDOWS.filter(w => w.r > 0.4).forEach(w => {
          const pool = new THREE.Mesh(new THREE.ShapeGeometry(hexShape(w.r)), poolMat.clone());
          pool.rotation.x = -Math.PI/2;
          // Estirada: la luz llega en diagonal, el hexágono se alarga.
          pool.scale.set(1.9, 1.25, 1);
          pool.position.set(5*w.y/9, 0.012, w.z - w.y/3);
          pool.visible = false;
          scene.add(pool); sunPoolsRef.current.push(pool);
        });

        // ── El exterior: Medellín ─────────────────────────────────────────
        // Este es el bloque que convierte los hexágonos en ventanas. Una
        // ventana no es un vidrio: es una VISTA. Sin nada detrás, el hueco
        // mejor modelado del mundo sigue leyéndose como un adorno pegado al
        // muro. Las fotos del colegio mandan lo que hay que ver: cielo azul
        // con cúmulos, la cordillera al fondo y vegetación tropical encima.
        const outside = new THREE.Group();

        // El exterior es ENVOLVENTE, no un telón detrás del muro. Un telón se
        // ve perfecto desde el ángulo para el que se armó y se descuadra en
        // cuanto la cámara gira — y aquí la cámara gira libremente. Una cúpula
        // resuelve todos los ángulos de una vez.
        const ORIGIN = new THREE.Vector3(5, 0, 4);

        // Cielo: degradado + cúmulos pintados a mano. El horizonte va a media
        // altura de la imagen, que es el ecuador de la esfera.
        const skyC = document.createElement('canvas'); skyC.width = 1024; skyC.height = 512;
        const sctx = skyC.getContext('2d');
        const drawSky = (top, mid, low) => {
          const g = sctx.createLinearGradient(0, 0, 0, 256);
          g.addColorStop(0, top); g.addColorStop(0.62, mid); g.addColorStop(1, low);
          sctx.fillStyle = g; sctx.fillRect(0, 0, 1024, 256);
          sctx.fillStyle = low; sctx.fillRect(0, 256, 1024, 256);   // bajo el horizonte
          // Cúmulos: elipses superpuestas, aplanadas abajo como los de verdad.
          // Se apiñan hacia el horizonte, que es lo que hace la perspectiva.
          for (let i = 0; i < 34; i++) {
            const cx = Math.random()*1024, cy = 26 + Math.pow(Math.random(), 0.6)*205;
            const s = 20 + Math.random()*46;
            sctx.fillStyle = 'rgba(255,255,255,' + (0.13 + Math.random()*0.20) + ')';
            for (let b = 0; b < 10; b++) {
              sctx.beginPath();
              sctx.ellipse(cx + (Math.random()-0.5)*s*2.6, cy + (Math.random()-0.5)*s*0.55,
                           s*(0.45+Math.random()*0.6), s*(0.28+Math.random()*0.30), 0, 0, Math.PI*2);
              sctx.fill();
            }
          }
        };
        drawSky('#2c74cf', '#82b9ea', '#dfeaf1');
        const skyTex = new THREE.CanvasTexture(skyC);
        skyTex.colorSpace = THREE.SRGBColorSpace;
        const sky = new THREE.Mesh(new THREE.SphereGeometry(46, 40, 24),
          new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
        sky.position.copy(ORIGIN);
        outside.add(sky);
        skyRef.current = { canvas: skyC, tex: skyTex, draw: drawSky, mesh: sky };

        // Cordillera: dos anillos a distinta distancia. El de atrás, más pálido
        // y azulado — la perspectiva aérea es lo que da la sensación de km.
        const ridge = (seed, h, color, alpha) => {
          const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
          const g = c.getContext('2d');
          g.clearRect(0,0,1024,256);
          g.fillStyle = color; g.globalAlpha = alpha;
          g.beginPath(); g.moveTo(0, 256);
          for (let x = 0; x <= 1024; x += 6) {
            const t = x/1024;
            // Las tres frecuencias son múltiplos enteros de 2π: así la cresta
            // cierra sin costura al dar la vuelta al anillo.
            const y = 256 - h * (0.52
              + 0.30*Math.sin(t*Math.PI*2*3  + seed)
              + 0.15*Math.sin(t*Math.PI*2*7  + seed*2.3)
              + 0.07*Math.sin(t*Math.PI*2*13 + seed*4.1));
            g.lineTo(x, y);
          }
          g.lineTo(1024, 256); g.closePath(); g.fill();
          const t2 = new THREE.CanvasTexture(c);
          t2.colorSpace = THREE.SRGBColorSpace;
          t2.wrapS = THREE.RepeatWrapping;
          return t2;
        };
        [[41, 7.2, 3.0, ridge(1.7, 150, '#8ea6c2', 0.90), 2],
         [35, 5.6, 2.0, ridge(4.2, 190, '#5f8168', 1.00), 3]].forEach(([rad, hgt, cy, tex, rep]) => {
          tex.repeat.set(rep, 1);
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(rad, rad, hgt, 64, 1, true),
            new THREE.MeshBasicMaterial({
              map: tex, transparent: true, side: THREE.BackSide,
              fog: false, depthWrite: false,
            }));
          m.position.set(ORIGIN.x, cy, ORIGIN.z);
          outside.add(m);
        });

        // Suelo del campus, justo bajo el piso del salón: así el salón se
        // apoya en algo en vez de flotar en el vacío.
        //
        // Un disco de color liso se lee como una losa de plástico y le roba
        // protagonismo al salón. Dos cosas lo arreglan: manchones de verde
        // (ningún césped es de un solo color) y un desvanecido al color del
        // horizonte en el borde — la bruma de la distancia, que además esconde
        // el canto del disco.
        const gC = document.createElement('canvas'); gC.width = 512; gC.height = 512;
        const gx = gC.getContext('2d');
        gx.fillStyle = '#6d8557'; gx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 420; i++) {
          const r = 14 + Math.random()*54;
          gx.fillStyle = Math.random() < 0.5
            ? 'rgba(120,145,86,' + (0.10 + Math.random()*0.16) + ')'
            : 'rgba(74,96,58,'   + (0.10 + Math.random()*0.16) + ')';
          gx.beginPath();
          gx.ellipse(Math.random()*512, Math.random()*512, r, r*(0.5+Math.random()*0.6),
                     Math.random()*Math.PI, 0, Math.PI*2);
          gx.fill();
        }
        const haze = gx.createRadialGradient(256, 256, 120, 256, 256, 256);
        haze.addColorStop(0,    'rgba(210,226,235,0)');
        haze.addColorStop(0.72, 'rgba(210,226,235,0.35)');
        haze.addColorStop(1,    'rgba(219,232,239,0.92)');
        gx.fillStyle = haze; gx.fillRect(0, 0, 512, 512);
        const grassTex = new THREE.CanvasTexture(gC);
        grassTex.colorSpace = THREE.SRGBColorSpace;
        grassTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const grass = new THREE.Mesh(new THREE.CircleGeometry(44, 64),
          new THREE.MeshBasicMaterial({ map: grassTex, fog: false }));
        grass.rotation.x = -Math.PI/2; grass.position.set(ORIGIN.x, -0.06, ORIGIN.z);
        outside.add(grass);

        // Vegetación tropical justo afuera. Copas de icosaedro achatado: con
        // flatShading leen como follaje sin costar una malla de verdad.
        const foliage = [0x4f7c3a, 0x5f8f42, 0x436b34, 0x6b9b48];
        // Los altos van LEJOS y los bajos cerca. Con todos pegados al muro, el
        // follaje tapaba el cielo y las ventanas quedaban del mismo valor que
        // la pared: un ventanal se reconoce porque BRILLA contra el muro, y
        // ese brillo lo pone el cielo, no el vidrio.
        const trees = [
          { x:-3.2,  z:0.1,  s:0.70 }, { x:-2.6,  z:3.1,  s:0.62 },
          { x:-3.6,  z:6.2,  s:0.75 }, { x:-2.9,  z:8.7,  s:0.58 },
          { x:-9.5,  z:1.4,  s:1.45 }, { x:-11.0, z:5.6,  s:1.70 },
          { x:-8.2,  z:9.2,  s:1.30 }, { x:-12.5, z:-1.5, s:1.55 },
          { x:-10.2, z:12.0, s:1.40 },
        ];
        trees.forEach(({x, z, s}, i) => {
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07*s, 0.11*s, 1.5*s, 6),
            new THREE.MeshBasicMaterial({ color: 0x6b5136, fog: false }));
          trunk.position.set(x, 0.75*s - 0.05, z); outside.add(trunk);
          for (let b = 0; b < 3; b++) {
            const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62*s, 0),
              new THREE.MeshBasicMaterial({ color: foliage[(i+b) % foliage.length], fog: false, flatShading: true }));
            crown.position.set(x + (b-1)*0.42*s, 1.5*s - 0.05 + b*0.30*s, z + ((b%2)-0.5)*0.5*s);
            crown.scale.set(1, 0.78, 1);
            crown.rotation.set(b*0.7, b*1.3, 0);
            outside.add(crown);
          }
        });

        scene.add(outside);
        outsideRef.current = outside;

        // ── Teacher's desk + monitor ──────────────────────────────────────
        const tDeskMat = stdMat({ color: 0x7c5228 });
        const tLegMat  = stdMat({ color: 0x5a3c1a });
        const tTop = new THREE.Mesh(RBox(1.7,0.06,0.75),tDeskMat);
        tTop.position.set(8.1,0.80,1.0); tTop.castShadow=true; scene.add(tTop);
        [[-0.70,-0.30],[0.70,-0.30],[-0.70,0.30],[0.70,0.30]].forEach(([lx,lz]) => {
          const l = new THREE.Mesh(RBox(0.055,0.80,0.055),tLegMat);
          l.position.set(8.1+lx,0.40,1.0+lz); scene.add(l);
        });
        // Monitor
        const monBase = new THREE.Mesh(RBox(0.28,0.02,0.18),
          stdMat({color:0x222222}));
        monBase.position.set(8.0,0.84,1.0); scene.add(monBase);
        const monStand = new THREE.Mesh(RBox(0.025,0.15,0.025),
          stdMat({color:0x333333}));
        monStand.position.set(8.0,0.915,0.95); scene.add(monStand);
        const monScreen = new THREE.Mesh(RBox(0.36,0.24,0.022),
          stdMat({color:0x1a2540,emissive:0x16203a,roughness:0.18,metalness:0.2}));
        monScreen.position.set(8.0,1.03,0.90); scene.add(monScreen);
        contactShadow(8.1, 1.0, 2.5, 0.52);

        // ── Columnas redondas ─────────────────────────────────────────────
        // Cilíndricas y de un café rojizo cálido. En las fotos interrumpen
        // las franjas de corcho y son parte del carácter del espacio.
        const colMat = stdMat({ color: 0x9a5f3c });
        [[0.55, 3.0], [0.55, 5.2]].forEach(([cx,cz]) => {
          const col = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,3.3,20), colMat);
          col.position.set(cx, 1.65, cz);
          col.castShadow = true; scene.add(col);
          contactShadow(cx, cz, 1.0, 0.55);
        });

        // ── Mueble bajo salmón (muro del fondo) ───────────────────────────
        const cabMat  = stdMat({ color: 0xe8a887 });
        const cabTop  = stdMat({ color: 0x9c6b45 });
        const cabBody = new THREE.Mesh(RBox(2.6,0.86,0.52), cabMat);
        cabBody.position.set(3.2,0.43,7.68); cabBody.castShadow = true; scene.add(cabBody);
        const cabSurf = new THREE.Mesh(RBox(2.68,0.055,0.58), cabTop);
        cabSurf.position.set(3.2,0.89,7.68); scene.add(cabSurf);
        // Puertas: las ranuras horizontales del mueble original
        [-0.66, 0.66].forEach(dx => {
          const dr = new THREE.Mesh(RBox(1.18,0.72,0.03),
            stdMat({ color: 0xefb598 }));
          dr.position.set(3.2+dx,0.44,7.42); scene.add(dr);
        });
        contactShadow(3.2, 7.6, 3.3, 0.5);

        // ── Estante de canastas de colores ────────────────────────────────
        const shelfMat = stdMat({ color: 0xc98f4e });
        const shelfBody = new THREE.Mesh(RBox(1.5,0.66,0.36), shelfMat);
        shelfBody.position.set(6.4,0.33,7.75); shelfBody.castShadow = true; scene.add(shelfBody);
        const binCols = [0xd94f3d, 0xe8a838, 0x3a8fd4, 0x4aa85c, 0xb45fb0, 0xe86a9c];
        binCols.forEach((c,i) => {
          const bin = new THREE.Mesh(RBox(0.21,0.18,0.24),
            stdMat({ color: c }));
          bin.position.set(5.78 + (i%3)*0.30, i<3 ? 0.50 : 0.20, 7.72);
          scene.add(bin);
        });
        contactShadow(6.4, 7.7, 2.1, 0.5);

        // ── Student desks + chairs (30 positions) ─────────────────────────
        const dTopMat  = stdMat({ color: 0xb8915a });
        const dLegMat  = stdMat({ color: 0x9aa0a6, roughness: 0.34, metalness: 0.85 });
        const cSeatMat = stdMat({ color: 0x1e4d8c, roughness: 0.42, metalness: 0.02 });
        const cLegMat  = stdMat({ color: 0x8f959b, roughness: 0.34, metalness: 0.85 });
        [1.2,2.8,4.4,5.6,7.2,8.8].forEach(dx => [1.0,2.5,4.0,5.5,7.0].forEach(dz => {
          const top = new THREE.Mesh(RBox(0.72,0.052,0.52),dTopMat);
          top.position.set(dx,0.76,dz); top.castShadow=true; top.receiveShadow=true; scene.add(top);
          [[-0.30,-0.21],[0.30,-0.21],[-0.30,0.21],[0.30,0.21]].forEach(([lx,lz]) => {
            const l = new THREE.Mesh(new THREE.CylinderGeometry(0.020,0.020,0.76,6),dLegMat);
            l.position.set(dx+lx,0.38,dz+lz); scene.add(l);
          });
          const seat = new THREE.Mesh(RBox(0.40,0.04,0.36),cSeatMat);
          seat.position.set(dx,0.44,dz+0.54); seat.castShadow=true; scene.add(seat);
          const back = new THREE.Mesh(RBox(0.40,0.33,0.040),cSeatMat);
          back.position.set(dx,0.63,dz+0.72); scene.add(back);
          [[-0.16,-0.16],[0.16,-0.16],[-0.16,0.16],[0.16,0.16]].forEach(([lx,lz]) => {
            const cl = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.44,5),cLegMat);
            cl.position.set(dx+lx,0.22,dz+0.54+lz); scene.add(cl);
          });
          contactShadow(dx, dz,        1.15, 0.50);   // pupitre
          contactShadow(dx, dz + 0.54, 0.78, 0.42);   // silla
        }));

        // ── Ceiling light fixtures ────────────────────────────────────────
        // Build radial glow sprite texture
        const glowCv = document.createElement('canvas'); glowCv.width=64; glowCv.height=64;
        const gctx = glowCv.getContext('2d');
        const grd = gctx.createRadialGradient(32,32,1,32,32,32);
        grd.addColorStop(0,'rgba(255,252,200,1)');
        grd.addColorStop(0.25,'rgba(255,242,160,0.6)');
        grd.addColorStop(1,'rgba(255,242,100,0)');
        gctx.fillStyle=grd; gctx.fillRect(0,0,64,64);
        const glowTex = new THREE.CanvasTexture(glowCv);

        const fixPos = {
          zone_A:[[2.0,1.3],[3.8,2.6]],
          zone_B:[[6.2,1.3],[8.0,2.6]],
          zone_C:[[2.0,5.4],[3.8,6.7]],
          zone_D:[[6.2,5.4],[8.0,6.7]],
        };
        // Cada lámpara va empotrada en un disco acústico de fieltro verde
        // colgado del techo. Los discos varían de tamaño, tono y altura —
        // en las fotos ninguno está a la misma altura que el vecino, y esa
        // irregularidad es justo lo que hace que el techo se vea como el real.
        const DISCS = [
          { r:0.72, y:3.06, c:0x2f6b3d },  // verde bosque
          { r:0.60, y:2.94, c:0x6f8f4a },  // verde oliva
          { r:0.67, y:3.01, c:0x8aa35c },  // verde salvia
          { r:0.56, y:2.88, c:0x3e7c46 },
          { r:0.69, y:3.04, c:0x7d9a52 },
          { r:0.62, y:2.92, c:0x2f6b3d },
          { r:0.65, y:2.99, c:0x8aa35c },
          { r:0.58, y:2.90, c:0x4f8348 },
        ];
        let discIdx = 0;

        Object.entries(fixPos).forEach(([zone, positions]) => {
          lightsRef.current[zone] = positions.map(([x,z]) => {
            const d = DISCS[discIdx++ % DISCS.length];

            // Varillas de suspensión — dos por disco, como en las fotos
            [[-d.r*0.55, 0],[d.r*0.55, 0]].forEach(([ox,oz]) => {
              const rodH = 3.3 - d.y;
              const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.011,0.011,rodH,5),
                stdMat({color:0x54585c, roughness:0.4, metalness:0.9}));
              rod.position.set(x+ox, d.y + rodH/2, z+oz); scene.add(rod);
            });

            // El disco de fieltro
            const disc = new THREE.Mesh(new THREE.CylinderGeometry(d.r, d.r, 0.07, 40),
              stdMat({ color: d.c, roughness: 0.96 }));
            disc.position.set(x, d.y, z);
            disc.castShadow = true; scene.add(disc);

            // Canto más oscuro: le da grosor de fieltro en vez de papel
            const rim = new THREE.Mesh(new THREE.TorusGeometry(d.r, 0.035, 6, 40),
              stdMat({ color: d.c, roughness: 0.96 }));
            rim.rotation.x = Math.PI/2;
            rim.position.set(x, d.y - 0.035, z); scene.add(rim);

            // La luminaria: un círculo empotrado en la cara inferior
            const panel = new THREE.Mesh(new THREE.CircleGeometry(d.r*0.42, 28),
              new THREE.MeshBasicMaterial({ color:0x1c1c1c }));
            panel.rotation.x = Math.PI/2;
            panel.position.set(x, d.y - 0.037, z);
            scene.add(panel);

            // Point light
            const pl = new THREE.PointLight(0xfff8e0,0,7.5);
            pl.position.set(x, d.y - 0.15, z);
            scene.add(pl);

            // Halo aditivo
            const spriteMat = new THREE.SpriteMaterial({
              map:glowTex, transparent:true, opacity:0,
              blending:THREE.AdditiveBlending, depthWrite:false
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(1.6,1.6,1);
            sprite.position.set(x, d.y - 0.12, z);
            scene.add(sprite);

            return { panel, pl, sprite };
          });
        });

        // ── Rain particles ────────────────────────────────────────────────
        const rainGroup = new THREE.Group();
        rainGroup.visible = false;
        scene.add(rainGroup);
        const drops = [];
        const dropGeo = new THREE.BoxGeometry(0.014,0.26,0.014);
        const dropMat = new THREE.MeshBasicMaterial({color:0x8bcde8,transparent:true,opacity:0.52});
        for (let i=0;i<200;i++) {
          const d = new THREE.Mesh(dropGeo,dropMat);
          d.position.set(Math.random()*13-1.5,Math.random()*5+0.3,Math.random()*11-1.5);
          d.userData.speed = 0.055 + Math.random()*0.05;
          rainGroup.add(d); drops.push(d);
        }
        rainRef.current = { group:rainGroup, drops };

        // ── Polvo suspendido ──────────────────────────────────────────────
        // Motas girando lentamente en el aire. Cuestan casi nada y hacen
        // dos cosas: dan escala (se ve que hay aire entre la cámara y el
        // fondo, no vacío) y delatan que la escena está viva aunque nadie
        // toque nada. Se concentran hacia las ventanas, que es donde la luz
        // rasante las revelaría de verdad.
        const DUST = 140;
        const dustPos = new Float32Array(DUST * 3);
        const dustPhase = new Float32Array(DUST);
        for (let i = 0; i < DUST; i++) {
          dustPos[i*3    ] = Math.pow(Math.random(), 1.7) * 9.5 + 0.3;  // sesgo a la ventana
          dustPos[i*3 + 1] = 0.35 + Math.random() * 2.7;
          dustPos[i*3 + 2] = Math.random() * 7.4 + 0.3;
          dustPhase[i] = Math.random() * Math.PI * 2;
        }
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

        const dustCv = document.createElement('canvas'); dustCv.width = dustCv.height = 32;
        const dctx = dustCv.getContext('2d');
        const dgr = dctx.createRadialGradient(16,16,0,16,16,16);
        dgr.addColorStop(0,   'rgba(255,250,235,1)');
        dgr.addColorStop(0.4, 'rgba(255,245,220,0.35)');
        dgr.addColorStop(1,   'rgba(255,240,200,0)');
        dctx.fillStyle = dgr; dctx.fillRect(0,0,32,32);

        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
          map: new THREE.CanvasTexture(dustCv),
          size: 0.045, sizeAttenuation: true,
          transparent: true, opacity: 0.5,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }));
        scene.add(dust);
        dustRef.current = { points: dust, phase: dustPhase, base: dustPos.slice() };

        // ── Orbit controls — ratón, dedo y lápiz ──────────────────────────
        // Se usan Pointer Events porque unifican los tres tipos de entrada.
        // Con "mousedown" solo funcionaba en computador: un celular nunca
        // dispara eventos de ratón.
        let dragging=false, lastX=0, lastY=0, theta=0.38, phi=0.60, radius=15.5;
        const el = renderer.domElement;

        // Imprescindible: sin esto el navegador móvil hace scroll de la página
        // en vez de dejar que rotemos la cámara.
        el.style.touchAction = "none";

        const pointers = new Map();   // dedos/punteros activos
        let lastPinch = 0;

        const pinchDist = () => {
          const [a, b] = [...pointers.values()];
          return Math.hypot(a.x - b.x, a.y - b.y);
        };

        const onDown = (e) => {
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          try { el.setPointerCapture(e.pointerId); } catch {}
          if (pointers.size === 1) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
          } else if (pointers.size === 2) {
            dragging = false;            // dos dedos = zoom, no rotación
            lastPinch = pinchDist();
          }
        };

        const onMove = (e) => {
          if (!pointers.has(e.pointerId)) return;
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (pointers.size === 2) {     // pellizcar para acercar/alejar
            const d = pinchDist();
            if (lastPinch) {
              radius = Math.max(7, Math.min(24, radius - (d - lastPinch) * 0.05));
            }
            lastPinch = d;
            return;
          }

          if (!dragging) return;
          theta -= (e.clientX - lastX) * 0.010;
          phi    = Math.max(0.12, Math.min(1.30, phi - (e.clientY - lastY) * 0.010));
          lastX = e.clientX; lastY = e.clientY;
        };

        const onUp = (e) => {
          pointers.delete(e.pointerId);
          try { el.releasePointerCapture(e.pointerId); } catch {}
          if (pointers.size < 2) lastPinch = 0;
          if (pointers.size === 0) {
            dragging = false;
          } else {
            // Al soltar un dedo, el que queda retoma la rotación sin saltos
            const p = [...pointers.values()][0];
            lastX = p.x; lastY = p.y; dragging = true;
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          radius = Math.max(7, Math.min(24, radius + e.deltaY * 0.018));
        };

        el.addEventListener("pointerdown",   onDown);
        el.addEventListener("pointermove",   onMove);
        el.addEventListener("pointerup",     onUp);
        el.addEventListener("pointercancel", onUp);
        el.addEventListener("wheel", onWheel, { passive: false });

        // ── Sombras para todo lo sólido ───────────────────────────────────
        // Una pasada al final en vez de recordar la bandera mueble por
        // mueble. Se saltan los materiales sin iluminación (superposiciones
        // de zona, haces de sol, vidrio): proyectar sombra desde ellos daría
        // manchas negras donde debería entrar la luz.
        scene.traverse(o => {
          if (!o.isMesh) return;
          const m = o.material;
          if (!m || m.isMeshBasicMaterial || m.transparent) return;
          o.castShadow = true; o.receiveShadow = true;
        });
        // El techo es la única excepción: si proyecta sombra, tapa el sol
        // que entra por las ventanas y el aula entera queda en penumbra.
        ceil.castShadow = false;

        // ── Animation loop ────────────────────────────────────────────────
        let id;
        let lastW = 0, lastH = 0;
        const animate = () => {
          id = requestAnimationFrame(animate);

          // Red de seguridad: si el contenedor cambió de tamaño y ningún
          // evento lo avisó (rotar el móvil, ocultarse la barra del
          // navegador), lo corregimos aquí. Garantiza que el lienzo
          // siempre llene su espacio en cualquier dispositivo.
          const cw = mount.clientWidth, ch = mount.clientHeight;
          if (cw && ch && (cw !== lastW || ch !== lastH)) {
            lastW = cw; lastH = ch;
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
            renderer.setSize(cw, ch);
          }

          camera.position.set(
            5 + radius*Math.sin(theta)*Math.cos(phi),
            radius*Math.sin(phi),
            4 + radius*Math.cos(theta)*Math.cos(phi)
          );
          camera.lookAt(5, 0.5, 4);

          // ── Parpadeo de emergencia ──────────────────────────────────────
          // Media onda cuadrada: encendido y apagado en bloques iguales.
          // Es lo que hace una baliza real — nada de desvanecerse suave,
          // porque lo que llama la atención es el corte brusco.
          const { zones: bz, ms: bms } = blinkRef.current;
          if (bz.length) {
            const on = Math.floor(Date.now() / bms) % 2 === 0;
            bz.forEach(zone => {
              lightsRef.current[zone]?.forEach(({panel,pl,sprite}) => {
                pl.intensity = on ? 7.5 : 0.0;
                // Rojo de alarma: se distingue al instante de la luz cálida
                // normal, incluso en una foto o un video de la feria.
                pl.color.setHex(0xff4530);
                panel.material.color.setHex(on ? 0xff5a3c : 0x2a1210);
                sprite.material.opacity = on ? 1.0 : 0.0;
              });
              const ov = zoneOverlaysRef.current[zone];
              if (ov) { ov.material.color.setHex(0xff3b30); ov.material.opacity = on ? 0.20 : 0.03; }
            });
          }

          // Deriva del polvo: una sinusoide lenta por mota, cada una con su
          // fase. Nunca se repite a la vista y no cuesta ni un milisegundo.
          const d = dustRef.current;
          if (d) {
            const t = Date.now() * 0.00016;
            const arr = d.points.geometry.attributes.position.array;
            for (let i = 0; i < d.phase.length; i++) {
              const ph = d.phase[i];
              arr[i*3    ] = d.base[i*3    ] + Math.sin(t + ph) * 0.16;
              arr[i*3 + 1] = d.base[i*3 + 1] + Math.sin(t * 0.7 + ph * 1.3) * 0.10;
              arr[i*3 + 2] = d.base[i*3 + 2] + Math.cos(t * 0.8 + ph) * 0.16;
            }
            d.points.geometry.attributes.position.needsUpdate = true;
          }

          if (rainRef.current.group?.visible) {
            rainRef.current.drops.forEach(d => {
              d.position.y -= d.userData.speed;
              if (d.position.y < 0) d.position.y = 5.5 + Math.random();
            });
          }
          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          const w = mount.clientWidth, h = mount.clientHeight;
          if (!w || !h) return;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener("resize", onResize);
        window.addEventListener("orientationchange", onResize);

        // Reacciona también cuando cambia el contenedor sin que cambie la
        // ventana — pasa en móvil al ocultarse la barra de direcciones.
        const ro = typeof ResizeObserver !== "undefined"
          ? new ResizeObserver(onResize) : null;
        ro?.observe(mount);

        return () => {
          cancelAnimationFrame(id);
          window.removeEventListener("resize", onResize);
          window.removeEventListener("orientationchange", onResize);
          ro?.disconnect();
          el.removeEventListener("pointerdown",   onDown);
          el.removeEventListener("pointermove",   onMove);
          el.removeEventListener("pointerup",     onUp);
          el.removeEventListener("pointercancel", onUp);
          el.removeEventListener("wheel", onWheel);
          renderer.dispose();
          if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
        };
      }, []);

      // ── Lights + people (updates on every state change) ───────────────────
      useEffect(() => {
        if (!classroomState?.zones || !sceneRef.current) return;
        const intens   = { ON:5.5, DIM:2.1, OFF:0.0 };
        const panelCol = { ON:0xfffac0, DIM:0xffe060, OFF:0x141414 };
        const opaMap   = { ON:0.09, DIM:0.055, OFF:0.022 };
        const glowOpa  = { ON:0.90, DIM:0.45, OFF:0.0 };

        const emg      = classroomState.emergency;
        const zColorsN = { zone_A:0x4a90d9, zone_B:0x5cb85c, zone_C:0xe8a838, zone_D:0x9b59b6 };

        // Las zonas que parpadean las conduce el bucle de render, no este
        // efecto: aquí solo se declara cuáles y a qué ritmo.
        blinkRef.current = {
          zones: Object.entries(classroomState.zones)
            .filter(([, d]) => d.light === "BLINK").map(([z]) => z),
          ms: emg?.blink_ms ?? 600,
        };

        Object.entries(classroomState.zones).forEach(([zone,data]) => {
          const s = data.light ?? "OFF";
          if (s === "BLINK") return;   // lo pinta el bucle de animación

          const enRuta = !!emg && (emg.route ?? []).includes(zone);

          lightsRef.current[zone]?.forEach(({panel,pl,sprite}) => {
            pl.intensity = intens[s] ?? 0;
            // En emergencia la ruta va en blanco frío y a tope: tiene que
            // leerse como "salida", no como iluminación de clase.
            pl.color.setHex(enRuta ? 0xffffff : 0xfff8e0);
            if (enRuta) pl.intensity = 7.5;
            panel.material.color.setHex(enRuta ? 0xffffff : (panelCol[s] ?? 0x141414));
            sprite.material.opacity = enRuta ? 1.0 : (glowOpa[s] ?? 0);
          });

          const ov = zoneOverlaysRef.current[zone];
          if (ov) {
            // Verde = por aquí se sale. Fuera de emergencia, el color propio
            // de cada zona.
            ov.material.color.setHex(enRuta ? 0x22c55e : zColorsN[zone]);
            ov.material.opacity = enRuta ? 0.16 : (opaMap[s] ?? 0.022);
          }
        });

        // Rebuild humanoid figures
        peopleRef.current.forEach(m => sceneRef.current.remove(m));
        peopleRef.current = [];
        const shirtColors  = { zone_A:0x3a7fc1, zone_B:0x27a85a, zone_C:0xd4890a, zone_D:0x8e44ad };
        const skinTones    = [0xfcd5a0, 0xf0a070, 0xc68642, 0x8d5524, 0xfde0b8];
        const hairColors   = [0x120800, 0x2e1a0a, 0x6b4520, 0x080808, 0xb8843a];
        const pantsColors  = [0x1c2d4a, 0x2d3a1c, 0x3a2010, 0x1a1a2e, 0x2e2418];

        (classroomState.people ?? []).forEach((p,idx) => {
          const shirt = shirtColors[p.zone] ?? 0x555588;
          const skin  = skinTones[idx % skinTones.length];
          const hair  = hairColors[idx % hairColors.length];
          const pants = pantsColors[idx % pantsColors.length];
          const x = p.x ?? 5, z = p.y ?? 4;
          const add = m => { m.castShadow=true; sceneRef.current.add(m); peopleRef.current.push(m); };

          // Sombra de contacto, igual que la del mobiliario: sin ella una
          // figura de pie parece calcada sobre el piso.
          const ao = contactRef.current;
          if (ao) {
            const sh = new THREE.Mesh(ao.geo, new THREE.MeshBasicMaterial({
              map: ao.tex, transparent: true, opacity: 0.46,
              depthWrite: false, color: 0x000000,
            }));
            sh.rotation.x = -Math.PI/2;
            sh.position.set(x, 0.009, z);
            sh.scale.set(0.85, 0.85, 1);
            sceneRef.current.add(sh); peopleRef.current.push(sh);
          }

          // Cápsulas en vez de cilindros: la extremidad termina en domo, sin
          // el canto duro que delataba al muñeco de bloques. Y los segmentos
          // suben lo suficiente para que la silueta se lea curva de lejos.
          const cap = (r, len, seg) => new THREE.CapsuleGeometry(r, len, 4, seg ?? 14);
          const skinMat  = stdMat({ color: skin,  roughness: 0.62 });
          const shirtMat = stdMat({ color: shirt, roughness: 0.82 });

          // Piernas — llegan hasta el piso.
          // Antes medían 0.34 y colgaban desde la cadera: la figura entera
          // flotaba 38 cm sobre la madera. Con la cabeza a la altura
          // correcta el error pasaba desapercibido de lejos, pero al
          // acercar la cámara se veía el hueco. Ahora la cápsula va de
          // y=0 a la cadera (0.82) y la persona se apoya de verdad.
          const legsM = stdMat({ color: pants, roughness: 0.86 });
          const LEG_R = 0.055, HIP_Y = 0.82;
          const legLen = HIP_Y - LEG_R*2;
          [-0.058, 0.058].forEach(lx => {
            const leg = new THREE.Mesh(cap(LEG_R, legLen, 12), legsM);
            leg.position.set(x+lx, HIP_Y/2, z); add(leg);
          });
          // Zapatos: rematan la pierna contra el piso. Sin ellos la cápsula
          // termina en domo y parece que la persona está de puntillas.
          const shoeM = stdMat({ color: 0x2b2b33, roughness: 0.6 });
          [-0.058, 0.058].forEach(lx => {
            const shoe = new THREE.Mesh(RBox(0.095, 0.055, 0.19), shoeM);
            shoe.position.set(x+lx, 0.028, z + 0.022); add(shoe);
          });
          // Torso — ligeramente más ancho de hombros que de cintura
          const body = new THREE.Mesh(cap(0.118, 0.30, 16), shirtMat);
          body.position.set(x, 1.06, z);
